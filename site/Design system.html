<script>if(new URLSearchParams(location.search).get('embed')==='hero'){document.documentElement.dataset.embed='hero';const motion=document.createElement('script');motion.src='preview-motion.js';motion.defer=true;document.head.append(motion)}</script>
<style>html[data-embed="hero"] .shell{display:block}html[data-embed="hero"] .nav,html[data-embed="hero"] .top{display:none}html[data-embed="hero"] main{padding:16px}html[data-embed="hero"] .home-gallery{grid-template-columns:repeat(3,minmax(0,1fr))}html[data-embed="hero"] body{overflow:hidden}html[data-embed="hero"] .home-tile>.stage>:first-child:not(.is-visible){opacity:0;translate:0 28px}@media(prefers-reduced-motion:reduce){html[data-embed="hero"] .home-tile>.stage>:first-child:not(.is-visible){opacity:1;translate:none}}html[data-embed="hero"] .home-canvas-tile .ds-canvas-world{top:50%;left:40px;transform:translateY(-50%)!important}/* shell */
html{scrollbar-gutter:stable}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);width:calc(100% - 48px);max-width:1440px;margin-inline:auto;min-height:100vh}
@media(max-width:800px){.shell{grid-template-columns:1fr;width:100%}.nav{position:static!important;height:auto!important;flex-direction:row!important;overflow-x:auto}.nav h1,.nav .grow{display:none}}
.nav{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;scrollbar-gutter:stable;overflow-anchor:none;display:flex;flex-direction:column;gap:2px;padding:20px 16px;border-right:1px solid var(--color-hairline)}
.ds-brand-logo{display:block;width:88px;height:auto;color:var(--text-default)}
.nav h1{margin:0 0 28px 8px;font-size:14px;line-height:20px;font-weight:500}
.nav button{display:flex;justify-content:space-between;gap:12px;padding:6px 8px;border-radius:var(--radius-md);color:var(--text-subtle);white-space:nowrap}
.nav button:hover{background:var(--color-tint)}.nav button[aria-current=true]{background:var(--color-tint);color:var(--text-default);font-weight:500}
.nav small{font-size:11px;color:var(--text-placeholder)}.grow{flex:1}
main{padding:28px clamp(16px,4vw,48px) 64px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.top h2{margin:0;font-size:18px;line-height:24px;font-weight:500}.top p{margin:2px 0 0;color:var(--text-subtle);max-width:56ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.item{min-width:0;display:flex;flex-direction:column;border-radius:var(--radius-lg);background:var(--color-base);box-shadow:var(--shadow-ring);overflow:hidden}
.stage{display:grid;place-items:center;min-height:170px;padding:24px;overflow:auto;background-image:radial-gradient(circle at 9.8px 8.7px,var(--color-hairline) 1.2px,transparent 1.3px);background-size:19.55px 17.35px;border-bottom:1px solid var(--color-hairline)}
.im{padding:12px}.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}.mh b{font-size:13px;line-height:20px;font-weight:500}
.im p{margin:2px 0 0;font-size:11px;line-height:15px;color:var(--text-subtle)}.im em{font-style:normal;color:var(--text-placeholder);margin-right:6px}
.hint{font-size:11px;line-height:15px;color:var(--text-placeholder)}.row{display:flex;gap:var(--space-8);align-items:center;flex-wrap:wrap;justify-content:center}.mr{display:inline-flex;align-items:center;gap:var(--space-8)}
.hr{height:1px;background:var(--color-hairline);margin:var(--space-4) 0}.empty{grid-column:1/-1;padding:48px;text-align:center;color:var(--text-subtle)}
/* foundations */
.swgrid{display:grid;grid-template-columns:repeat(3,72px);gap:var(--space-12)}.swc{display:grid;gap:var(--space-6);font-size:11px;color:var(--text-subtle)}.swc i{height:32px;border-radius:var(--radius-sm);box-shadow:var(--shadow-ring)}
.spr{display:flex;align-items:center;gap:var(--space-12);font-size:11px;color:var(--text-subtle)}.spr i{height:8px;border-radius:var(--radius-xs);background:var(--color-brand)}
.rd,.el{display:grid;gap:var(--space-6);justify-items:center;font-size:11px;color:var(--text-subtle)}.rd i,.el i{width:44px;height:44px;background:var(--color-base);box-shadow:var(--shadow-ring)}
.pop{position:fixed;z-index:20;padding:var(--space-4);border-radius:var(--radius-md);background:var(--color-base);box-shadow:var(--shadow-float)}
.pop button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:var(--space-6) var(--space-8);border-radius:var(--radius-sm);font-weight:500}
.pop button:hover,.pop button:focus-visible{background:var(--color-tint);outline:0}.pop [aria-checked=true]::after{content:"\2713";color:var(--color-brand-hover)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);padding:var(--space-8) 14px;border-radius:var(--radius-md);background:var(--color-contrast);color:var(--text-inverse);font-weight:500;box-shadow:var(--shadow-dialog);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}
.imp{display:block;margin-top:var(--space-6);padding:var(--space-4) var(--space-6);border-radius:var(--radius-sm);background:var(--color-recessed);font:11px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-subtle);overflow:auto;white-space:nowrap}
details{margin-top:var(--space-6)}summary{cursor:pointer;color:var(--text-subtle);font-weight:500}
.api{max-width:none;margin-top:var(--space-4);font-size:11px;line-height:15px}.api td,.api th{padding:var(--space-4) var(--space-8) var(--space-4) 0;vertical-align:top;white-space:normal}.api tbody tr{cursor:default}.api tbody tr:hover{background:none}.api code{font:11px/15px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-subtle)}
.doc{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--space-16)}
.doc section{min-width:0;padding:var(--space-16);border-radius:var(--radius-lg);background:var(--color-base);box-shadow:var(--shadow-ring)}
.doc h3{margin:0 0 var(--space-8);font-size:13px;line-height:20px;font-weight:500}.doc p{margin:var(--space-8) 0 0;color:var(--text-subtle)}
.doc pre{margin:0;overflow:auto;font:11px/18px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-subtle)}
.doc ol{margin:0;padding-left:var(--space-16);display:grid;gap:var(--space-6);color:var(--text-subtle)}
.flow{display:flex;align-items:center;gap:var(--space-6);flex-wrap:wrap}.flow>svg{color:var(--text-placeholder)}
.ph{display:grid;gap:var(--space-8);width:100%;max-width:440px}.phm{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-12);flex-wrap:wrap}.phm h3{margin:0;font-size:18px;line-height:24px;font-weight:500}.phm p{margin:2px 0 0;color:var(--text-subtle)}

/* documentation pages */
.nav .ds-nav-section{margin-top:16px;flex-shrink:0}.nav .ds-nav-items{display:grid;gap:2px}
@media(max-width:800px){.nav .ds-nav-section{margin-top:0;min-width:180px}}
.nav{overflow:auto}.nav .nav-group{margin:18px 8px 4px;font-size:10px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-placeholder)}
.nav button[data-page]{width:100%;font-size:12px}.nav button[data-page].current{background:var(--color-tint);color:var(--text-default);font-weight:500}
.api-reference-table{max-width:100%;overflow-x:auto}.reading[data-api-reference] ul{padding-left:20px;display:grid;gap:var(--space-8);color:var(--text-subtle)}
.main{min-width:0}.reading{grid-column:1/-1;width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}.reading>section{min-width:0;padding:0 0 24px;border-bottom:1px solid var(--color-hairline)}.reading>section:last-child{border-bottom:0}.reading h3{margin:0 0 var(--space-8);font-size:14px;line-height:20px;font-weight:500}.reading p{margin:0 0 var(--space-12);color:var(--text-subtle);max-width:72ch}.reading .stage{min-height:150px;border:1px solid var(--color-hairline);border-radius:var(--radius-md)}.reading .imp{white-space:pre;line-height:18px}.reading .api{margin-top:var(--space-8)}.reading ol{padding-left:20px;display:grid;gap:var(--space-8);color:var(--text-subtle)}.reading ol b{color:var(--text-default);font-weight:500}.reading .slist{max-width:none}
@media(max-width:800px){main{padding-top:18px}.nav .nav-group{margin-top:8px}}

.home-gallery{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--color-hairline);border:1px solid var(--color-hairline)}
.home-tile{position:relative;aspect-ratio:1;min-width:0;display:flex;align-items:center;justify-content:center;background:var(--color-canvas);padding:var(--space-24);overflow:auto}
.home-tile>.tile-title{position:absolute;top:var(--space-16);left:var(--space-16);color:var(--text-subtle);font-weight:500}.home-tile>.tile-title:hover{color:var(--text-default)}
/* Clip the transformed File Card box before it contributes to stage overflow. */
.stage [data-preview-component="File card"],.stage [data-home-esm="File card"]{overflow:clip;overflow-clip-margin:2px}
.home-tile>.stage{width:100%;min-height:0;padding:var(--space-16) 0 0;border:0;background:none;overflow:visible}
.home-canvas-tile>.stage>[data-home-esm]{height:100%;display:block}
.home-tile [data-home-esm="Switch"],.home-tile [data-home-esm="Checkbox"],.home-tile [data-home-esm="Radio"]{display:flex;align-items:center;justify-content:center}

@media(max-width:1100px){.home-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.home-gallery{grid-template-columns:1fr}}

.btn:disabled,.sw:disabled,.select:disabled{cursor:not-allowed;opacity:.5}.field:has(input:disabled){opacity:.5}.field:has([aria-invalid="true"]){box-shadow:inset 0 0 0 1px var(--color-danger)}.field.small{min-height:24px}.divider-vertical{width:1px;height:48px;background:var(--color-hairline)}
.spinner{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}/* Usage-code disclosures only — details inside component stages keep their own spacing. */
.variant-example>details{margin-top:var(--space-12)}

.icon-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px;background:var(--color-hairline);border:1px solid var(--color-hairline);border-radius:var(--radius-md);overflow:hidden}.icon-cell{display:flex;flex-direction:column;align-items:center;gap:var(--space-12);padding:var(--space-16) var(--space-8);background:var(--color-base);font-size:11px;text-align:center}.rune-glyph{display:flex;color:var(--text-default)}.reading a{color:var(--color-brand-hover)}
</style>

<body>
<div class="shell">
<nav class="nav sx-scroll-area" id="nav" aria-label="Layers"></nav>
<main class="main">
<div class="top"><div><h2 id="title">Home</h2><p id="sub"></p></div>
<div class="sx-row"><span class="sx-row"><span id="theme-label">Light/Dark</span><button type="button" class="sw" id="theme" role="switch" aria-labelledby="theme-label" aria-checked="false"><i></i></button></span><label class="field"><span data-rune-icon="search"></span><input id="q" placeholder="Search components..." aria-label="Search components"></label></div></div>
<div class="grid" id="grid"></div>
</main>
</div>
<div id="pop" class="pop" role="menu" hidden></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const ic=runeIcon;
const cv=(s=12)=>`<span class="cv">${ic('chev',s)}</span>`;
const LBL={sys:'System',req:'Requirement',fn:'Functions',tc:'Test Case'},OW={W:'fn',N:'tc',J:'req'};
/* atoms */
const btn=(l,v='secondary',i='',a='')=>`<button class="btn ${v}" ${a}>${i?ic(i,16):''}${l}</button>`;
const ibtn=(i,v='',a='',t=i)=>SESAMA_UI.iconButton(i,v,a,t);
const av=(o,l,a='')=>`<span class="av tone-neutral${l?' l':''}" ${a}>${o}</span>`;
const sw=on=>`<button class="sw" role="switch" aria-checked="${!!on}" data-switch aria-label="Toggle setting"><i></i></button>`;
const tl=t=>`<span class="tl ${t}">${ic(t,13)}${LBL[t]}</span>`;
const chip=(i,l)=>`<button class="chip ${i==='req'?'req':''}" data-toast="Opened ${l}"><span class="c">${ic(i,13)}</span>${l}</button>`;
const badge=(l,t='')=>`<span class="badge ${t}">${l}</span>`;
/* molecules */
const sel=(l,items,i='',v='',w=240)=>`<button class="select ${v}" style="width:${w}px" data-menu="${items}" data-pick>${i?ic(i):''}<span class="lbl">${l}</span>${cv()}</button>`;
const seg=(items,on,v)=>`<div class="${v}" data-seg role="tablist">${items.map(x=>`<button role="tab" class="${x===on?'on':''}">${x}</button>`).join('')}</div>`;
const tree=nodes=>SESAMA_UI.tree(nodes);
const row=(n,on,s)=>`<div class="lrow${on?'':' off'}">${ic('skill',16)}<span class="nm">${n}</span><span class="st"><i class="dot"></i><span class="st-t">${on?'Enabled':'Disabled'}</span></span>${s?sw(on):''}${ibtn('kebab','','data-menu="Edit,Duplicate,Delete" data-verb="Selected"','Row actions')}</div>`;
const card=(t,n,o={})=>{
 const m=`<span class="mr">${o.c?`<span class="cm">${ic('chat',12)}${o.c}</span>`:''}${o.w?av(o.w):''}</span>`;
 const b=`<div class="cb"><b>${n}</b>${o.d?badge('Draft'):''}</div>${o.h?ibtn('chevR','raised nopen',`data-toast="Expanded ${n}"`,'Expand'):''}`;
 return o.bare?`<div class="node ${t}"><div class="tl">${ic(t,13)}${LBL[t]}</div><div class="card bare${o.on?' on':''}" data-i data-sel>${b}</div></div>`
 :`<div class="card${o.on?' on':''}" data-i data-sel><div class="ch">${tl(t)}${m}</div>${b}</div>`};
const TONES=['neutral','informative','success','error','disabled'];
const label=(text,tone='neutral')=>`<span class="tl tone-${tone}">${text}</span>`;
const tag=(text,tone='neutral')=>`<button type="button" class="chip tone-${tone}" data-chip-select aria-pressed="false" ${tone==='disabled'?'disabled':''}>${text}</button>`;
const genericCard=(title,o={})=>`<div class="card${o.selected?' on':''}" style="max-width:300px" data-i data-sel><div class="ch">${label(o.category||'Project',o.tone||'neutral')}${o.owner?av(o.owner):''}</div><div class="cb"><b>${title}</b>${o.description?`<span class="hint">${o.description}</span>`:''}${o.status?`<span class="badge tone-neutral">${o.status}</span>`:''}</div>${o.expand?ibtn('chevR','raised nopen','data-toast="Expanded item"','Expand item'):''}</div>`;
const DOTS=[...'0000001010011101111111111'].map((v,k)=>`<circle class="d${v}" cx="${2.4+4.8*(k%5)}" cy="${2.4+4.8*Math.floor(k/5)}" r="2.05"/>`).join('');
const swc=(n,v)=>`<button class="swc" data-toast="${v}"><i style="background:var(${v})"></i>${n}</button>`;
const TREE=[{n:'Vehicle',i:'sys',t:'sys',k:[{n:'Chassis',i:'sys',t:'sys'},{n:'Powertrain',i:'sys',t:'sys',k:[{n:'Peak Wheel Power',i:'req',t:'req'},{n:'Mass of Powertrain',i:'req',t:'req'}]}]}];
const MD='# Systems Engineering Skill\n\nYou are an experienced systems engineer focused on reliability, scalability, security, and operational excellence.\n\n## Core Principles\n\n* Prefer simple architectures over complex ones.\n* Design for failure; assume components will eventually break.\n* Automate repetitive operations.';
/* [layer, name, base ui primitive, variants, built from, preview] */
const C=[
['Foundations','Color','\u2014','semantic roles, light-dark(); never raw colors','',`<div class="swgrid">${[['canvas','--color-canvas'],['base','--color-base'],['recessed','--color-recessed'],['tint','--color-tint'],['fill','--color-fill'],['brand','--color-brand'],['success','--color-success'],['danger','--color-danger'],['neutral','--color-neutral'],['type-sys','--color-type-sys'],['type-req','--color-type-req'],['type-fn','--color-type-fn'],['type-tc','--color-type-tc']].map(x=>swc(...x)).join('')}</div>`],
['Foundations','Typography','\u2014','Inter Variable; UI 13px, content 14px, regular 400 and medium 500','',`<div style="display:grid;gap:10px">${[['Title','18/24 \u00b7 500',18,24,500],['Body','14/22 \u00b7 400',14,22,400],['UI text','13/20 \u00b7 400',13,20,400],['Caption','11/15 \u00b7 500',11,15,500]].map(([n,m,s,l,w])=>`<div style="display:flex;gap:16px;align-items:baseline"><span style="font-size:${s}px;line-height:${l}px;font-weight:${w};min-width:80px">${n}</span><span class="hint">${m}</span></div>`).join('')}</div>`],
['Foundations','Spacing','\u2014','4px base; --space-2 to --space-24','',`<div style="display:grid;gap:6px">${[2,4,6,8,12,16,24].map(p=>`<div class="spr"><i style="width:${p*4}px"></i>--space-${p} \u00b7 ${p}px</div>`).join('')}</div>`],
['Foundations','Radius','\u2014','xs, sm, md, lg, xl','',`<div class="row" style="gap:16px">${[['xs',4],['sm',6],['md',8],['lg',12],['xl',16]].map(([n,p])=>`<div class="rd"><i style="border-radius:var(--radius-${n})"></i>${n} \u00b7 ${p}</div>`).join('')}</div>`],
['Foundations','Elevation','\u2014','ring, float, dialog','',`<div class="row" style="gap:20px">${['ring','float','dialog'].map(e=>`<div class="el"><i style="box-shadow:var(--shadow-${e});border-radius:var(--radius-md)"></i>shadow-${e}</div>`).join('')}</div>`],
['Components','Button','Button','primary, secondary, outline, ghost, dashed, destructive; sizes xs to lg; shapes base, square, circle','Icon',''],
['Components','Button group','Menu','primary','Button, Icon',''],
['Components','Badge','\u2014','neutral, requirement, test case','',''],
['Components','Status dot','HTML','semantic tones, sizes, presence, activity','',''],
['Components','Avatar','Avatar','16, 24; hue per owner','',''],
['Components','Switch','Switch','on, off','',''],
['Components','Input','Input','default, with icon','Icon',''],
['Components','Chip','\u2014','file, requirement','Icon',''],
['Components','Label','\u2014','system, requirement, functions, test case','Icon',''],
['Components','Wire','\u2014','bezier, dot ends','',''],
['Components','Divider','Separator','horizontal','',''],
['Components','Select','Select','field, inline','Button, Icon, Menu',''],
['Components','Tabs','Tabs','segmented, pill, line','Button',''],
['Components','Breadcrumbs','\u2014','typed','Button, Icon',''],
['Components','Tree item','Collapsible','nav, typed, nested','Icon, Label',''],
['Components','List row','Switch','enabled, disabled; with or without switch','Icon, Status dot, Switch, Button',''],
['Components','Card','\u2014','framed, bare, selected, expandable','Label, Badge, Avatar, Button',''],
['Components','Toolbar','Toolbar','actions, zoom group','Button',''],
['Components','Message','\u2014','user','',''],
['Components','Collapsible','Collapsible','plan','Button, Icon',''],
['Components','File card','File','with preview, without preview, common file types','Icon, Button',''],
['Components','Input area','Input','empty, ready','Select, Button',''],
['Blocks','Agent card','\u2014','skills, actions','Button, List row',`<div class="agent"><svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true">${DOTS}</svg><b>Regulatory Agent</b><p>You are an experienced systems engineer focused on reliability, scalability, security, and operational excellence.</p><span class="cap">Skills</span><div class="slist plain">${row('Verification Planning',1,0)}${row('Naming Conventions',1,0)}</div><div class="foot">${btn('Edit','secondary','','data-toast="Editing agent"')}${btn('Run Agent','primary','','data-toast="Agent started"')}</div></div>`],
['Components','Table','\u2014','sortable, selectable','Badge, Avatar',''],
];
/* shell */

let formExampleId=0;
function formExample(kind,variant='default'){
 const password=kind==='Password Input',phone=kind==='Phone Input',readonly=variant==='read only',type=password?(variant==='visible'?'text':'password'):phone?'tel':'email';
 return SESAMA_UI.inputField({id:`example-field-${++formExampleId}`,label:password?'Password':phone?'Phone number':'Email',name:phone?'phone':password?'password':'email',type,passwordToggle:password,autocomplete:phone?'tel':password?'new-password':'email',placeholder:phone?(variant==='country prefix'?'812 3456 7890':'+62 812 3456 7890'):password?'Enter password':'name@example.com',value:variant==='filled'||readonly?(phone?'+62 812 3456 7890':password?'Demo-password':'jordan@example.com'):'',disabled:variant==='disabled',readonly,invalid:variant==='invalid',required:variant==='required',prefix:phone&&variant==='country prefix'?'+62':'',helper:variant==='helper'?(phone?'Include your country code.':password?'Use at least 8 characters for a new password.':'We will use this address to contact you.'):'',error:variant==='invalid'?'Check this value and try again.':''});
}

C.push(['Components','Input Field','Input Field','default, helper, required, invalid; password and phone compositions','Label, Input',formExample('Input Field','helper')]);


function toastExample(tone='neutral',persistent=false){return `<button class="btn secondary" data-demo-toast="${tone}" data-message="${tone==='error'?'Unable to save changes. Try again.':tone==='success'?'Changes saved successfully.':'Your export is ready.'}" ${persistent?'data-persistent':''}>Show ${persistent?'persistent ':''}${tone} toast</button>`}
function modalExample(variant='default'){
 const id=`modal-${++formExampleId}`,isForm=variant==='form',confirmation=variant==='confirmation';
 const actions=`<div class="actions"><button type="button" class="btn secondary" data-modal-close>Cancel</button><button type="${isForm?'submit':'button'}" class="btn primary" ${isForm?'':'data-modal-confirm'}>${confirmation?'Confirm':'Save changes'}</button></div>`;

const structureInfo={
'Quick start & dev server':{desc:'Run the built-in development server to explore components and demos.',body:`<pre>npm run dev\n# Open http://127.0.0.1:4173</pre><p>The local static server serves modern ES Modules, assets, and all application demos with zero build step required.</p>`},
'Package installation':{desc:'Install Sesama UI as an npm dependency in modern ESM projects.',body:`<pre>npm install sesama-ui</pre><p>Or import canonical modules directly from <code>src/index.mjs</code> or package subpaths in this workspace.</p>`},
'CSS isolation & .sui-root':{desc:'Include core stylesheets and wrap your application in the <code>.sui-root</code> boundary.',body:`<pre>&lt;!-- Include in document &lt;head&gt; --&gt;\n&lt;link rel="stylesheet" href="../src/styles/components.css"&gt;\n&lt;link rel="stylesheet" href="../src/styles/blocks.css"&gt;\n&lt;link rel="stylesheet" href="../src/styles/fonts.css"&gt;\n\n&lt;!-- Wrap in .sui-root for strict token scoping without specificity inflation --&gt;\n&lt;body class="sui-root" data-sui-theme="light"&gt;\n  &lt;div id="app"&gt;&lt;/div&gt;\n&lt;/body&gt;</pre><p>All component and block selectors use <code>:where(.sui-root)</code> so host styles and resets are never overwritten.</p>`},
'Pure functional builders':{desc:'Render semantic, accessible markup strings with pure functions without DOM dependencies.',body:`<pre>import { button, inputField, select, modal } from 'sesama-ui';\n\nconst html = inputField({\n  id: 'email',\n  label: 'Email address',\n  type: 'email',\n  placeholder: 'name@example.com'\n}) + button({\n  label: 'Submit',\n  type: 'submit',\n  variant: 'primary',\n  size: 'base'\n});\n\ndocument.getElementById('app').innerHTML = html;</pre>`},
'Runtime hydration & mount':{desc:'Progressively attach controllers, keyboard navigation, popovers, and form lifecycles.',body:`<pre>import { mount } from 'sesama-ui';\n\n// Activate all [data-sui-*] interactive components within root\nconst session = mount(document.body);\n\n// Refresh session after replacing or injecting dynamic markup:\nsession.refresh();\n\n// Teardown and clean up event listeners on page unmount:\nsession.destroy();</pre>`},
'Subpath imports':{desc:'Import individual components and blocks without bundling the entire kit.',body:`<pre>import { button, iconButton } from 'sesama-ui/button';\nimport { table, initTable } from 'sesama-ui/table';\nimport { appShell, workspaceSidebar } from 'sesama-ui/blocks';\nimport { controlIcon } from 'sesama-ui/icons';</pre><p>Individual stylesheets are also available under <code>sesama-ui/css/components/button.css</code>, etc.</p>`},
'Folder structure':{desc:'Canonical source layout for tokens, components, blocks, runtime, and styles.',body:`<pre>src/\n├─ components/     48 pure ESM component builders & controllers\n├─ blocks/         12 generic structural layout & content blocks\n├─ icons/          Rune outline glyphs and control icons\n├─ styles/\n│  ├─ tokens.css   Semantic tokens, light-dark()\n│  ├─ base.css     .sui-root baseline and resets\n│  ├─ components/  Scoped component CSS\n│  └─ blocks/      Scoped block CSS\n├─ runtime.mjs     Explicit controller registry & mount()\n└─ index.mjs       Unified package entry point</pre>`},
'Layers and imports':{desc:'Imports flow in one direction, from shared foundations toward product pages.',body:`<div class="flow"><span class="chip">Tokens</span>${ic('chevR',12)}<span class="chip">Components</span>${ic('chevR',12)}<span class="chip">Blocks</span>${ic('chevR',12)}<span class="chip">Pages</span></div><p>Components consume tokens. Blocks compose components. Pages assemble blocks. A component never imports a block, and a block never reaches into another block.</p>`},
'Component vs block':{desc:'Choose the layer that matches how reusable the pattern should be.',body:`<table class="api"><thead><tr><th></th><th>Component</th><th>Block</th></tr></thead><tbody><tr><td>Scope</td><td>One generic UI element</td><td>A page-level pattern</td></tr><tr><td>Content</td><td>Driven by props / options</td><td>Layout and composition slots</td></tr><tr><td>Install</td><td>Import from package / subpath</td><td>Import from blocks / subpath</td></tr><tr><td>Customize</td><td>Tokens and variants</td><td>Configurable slots and data</td></tr></tbody></table>`},
'Component rules':{desc:'Shared rules keep behavior, styling, and accessibility predictable.',body:`<ol><li>Name tokens by role, never by hue. Avoid raw colors in components.</li><li>Use data-sui-theme for light and dark appearance; theme overrides change tokens.</li><li>Keep shared options consistent: variant, size, icon, loading, disabled, id, attributes.</li><li>Use the fixed size, spacing, radius, and shadow scales.</li><li>Keep business content and product layout in blocks.</li><li>Give icon-only controls an aria-label and preserve the brand focus ring.</li></ol>`},
'Component anatomy':{desc:'Clean separation between pure markup, scoped styling, and behavior.',body:`<pre>// Pure builder: src/components/button.mjs\nexport function button({ label, variant = 'primary', size = 'base' }) { ... }\n\n// Scoped CSS: src/styles/components/button.css\n:where(.sui-root) .btn { ... }\n\n// Type declaration: src/components/button.d.mts\nexport interface ButtonOptions { ... }</pre>`},
'Customization':{desc:'Customize at the narrowest layer that fits the change.',body:`<ol><li>Theme: override only the semantic tokens that differ at .sui-root.</li><li>Variant: choose documented variants (primary, secondary, outline, ghost).</li><li>Block: assemble configurable layout slots and data sections for page needs.</li></ol>`}
};
const skillInfo={
'Agent skill overview':{desc:'A dedicated AI coding skill guiding agents to build consistent interfaces with Sesama UI.',body:`<p>The Sesama UI skill is located in <code>skills/sesama-ui/SKILL.md</code>. It equips AI coding agents (and developers) with the rules, references, and exact workflow to construct dashboards, forms, AI workspaces, and data tables.</p><div class="flow"><span class="chip">1. Locate system</span>${ic('chevR',12)}<span class="chip">2. Read references</span>${ic('chevR',12)}<span class="chip">3. Pure builders</span>${ic('chevR',12)}<span class="chip">4. Mount & hydrate</span></div><p>Agents always reuse canonical ESM components and structural blocks rather than inventing ad-hoc inline HTML or restyling internal selectors.</p>`},
'Skill guidelines':{desc:'Core rules that agents follow to maintain consistency, accessibility, and visual parity.',body:`<ol><li><b>Canonical components only:</b> Import from <code>src/index.mjs</code> or <code>sesama-ui</code>. Never invent inline custom variants.</li><li><b>Semantic tokens:</b> Use role-based color, spacing, radius, and elevation tokens. Never use raw hex colors.</li><li><b>Wrap in .sui-root:</b> Ensure the document body or container has <code>class="sui-root"</code>.</li><li><b>Pure string builders:</b> Builders accept options and return escaped HTML. Importing a module performs no DOM work and starts no listeners.</li><li><b>Explicit lifecycle:</b> Call <code>mount(root)</code> to attach interactive controllers. Call <code>session.refresh()</code> after DOM updates; call <code>session.destroy()</code> on unmount.</li></ol>`},
'Reference guides':{desc:'Comprehensive documentation available in <code>skills/sesama-ui/references/</code>.',body:`<table class="api"><thead><tr><th>Guide</th><th>File</th><th>Coverage</th></tr></thead><tbody><tr><td><b>Runtime</b></td><td><code>references/runtime.md</code></td><td>Mount lifecycle, session refresh, controller registry, and native form integration.</td></tr><tr><td><b>Page blocks</b></td><td><code>references/page-blocks.md</code></td><td>App shell, workspace sidebar, page header, layout variants, and responsive grids.</td></tr><tr><td><b>Content blocks</b></td><td><code>references/content-blocks.md</code></td><td>Data sections, content sections, metric cards, people lists, and activity feeds.</td></tr><tr><td><b>Agent workspace</b></td><td><code>references/agent-workspace.md</code></td><td>Chat composer, message bubbles, file cards, tool calls, and agent runs.</td></tr><tr><td><b>Charts</b></td><td><code>references/charts.md</code></td><td>Vanilla SVG charts: lines, areas, bars, donuts, and chart section integration.</td></tr></tbody></table>`},
'Starter page template':{desc:'A production-ready starter template provided in <code>skills/sesama-ui/assets/page.html</code>.',body:`<pre>&lt;!doctype html&gt;\n&lt;html lang="en"&gt;\n&lt;head&gt;\n  &lt;meta charset="utf-8"&gt;\n  &lt;meta name="viewport" content="width=device-width,initial-scale=1"&gt;\n  &lt;title&gt;Sesama App&lt;/title&gt;\n  &lt;link rel="stylesheet" href="../src/styles/components.css"&gt;\n  &lt;link rel="stylesheet" href="../src/styles/blocks.css"&gt;\n  &lt;link rel="stylesheet" href="../src/styles/fonts.css"&gt;\n&lt;/head&gt;\n&lt;body class="sui-root" data-sui-theme="light"&gt;\n  &lt;div id="app"&gt;&lt;/div&gt;\n  &lt;script type="module"&gt;\n    import {\n      appShell,\n      workspaceSidebar,\n      pageHeader,\n      pageLayout,\n      dataSection,\n      table,\n      mount\n    } from './src/index.mjs';\n\n    document.getElementById('app').innerHTML = appShell({\n      sidebar: workspaceSidebar({ workspace: 'Sesama Workspace' }),\n      header: pageHeader({ title: 'Overview', icon: 'grid-3x3' }),\n      content: pageLayout(dataSection({ title: 'Recent Data' }), { variant: 'dashboard' })\n    });\n\n    // Hydrate interactive controllers\n    const session = mount(document.body);\n  &lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;</pre>`}

function paint(){
 document.getElementById('title').removeAttribute('aria-label');document.getElementById('title').hidden=false;
 document.getElementById('theme').setAttribute('aria-checked',String(document.documentElement.dataset.mode?document.documentElement.dataset.mode==='dark':matchMedia('(prefers-color-scheme: dark)').matches));
 const byName=(a,b)=>a[1].localeCompare(b[1],'en',{sensitivity:'base'});
 const components=C.filter(x=>x[0]==='Components').sort(byName),blocks=C.filter(x=>x[0]==='Blocks').sort(byName);
 const navItem=(target,text)=>`<button data-page="${target}" class="${page===target?'current':''}">${text}</button>`;
 const navGroup=(name,content)=>window.canonicalSidebarGroup?.(name,content)||'';
 if(!nav.querySelector('[data-nav-group]'))nav.innerHTML=`<h1 aria-label="Sesama">${dsBrandLogo}</h1>${navItem('Home','Home')}${navItem('Installations','Installations')}${navItem('Component API reference','Component API reference')}${navItem('Skill','Skill')}${navGroup('Foundations',foundationNames.map(n=>navItem(labelPage('Foundations',n),n)).join('')+navItem('Icons:Essential','Icons'))}${navGroup('Components',components.map(x=>navItem(labelPage('Components',x[1]),x[1])).join(''))}${navGroup('Blocks',blocks.map(x=>navItem(labelPage('Blocks',x[1]),x[1])).join(''))}<span class="grow"></span>`;
 nav.querySelectorAll('[data-page]').forEach(button=>{const current=button.dataset.page===page;button.classList.toggle('current',current);if(current)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});
 document.getElementById('q').value=q;document.getElementById('q').placeholder='Search guidelines and components';
 if(page==='Component API reference'){document.getElementById('title').textContent='Component API reference';document.getElementById('sub').textContent='ESM builders, runtime lifecycle, theming, and integration contracts.';grid.innerHTML='<article class="reading" data-api-reference aria-live="polite"><section><p>Loading API reference�</p></section></article>';window.renderComponentApiReference?.();return}
 if(page==='Installations'){document.getElementById('title').textContent='Installations';document.getElementById('sub').textContent='Set up and use the Sesama design system.';grid.innerHTML=`<article class="reading">${structureNames.map(name=>`<section><h3>${name}</h3><p>${structureInfo[name].desc}</p>${structureInfo[name].body}</section>`).join('')}</article>`;return}
if(page==='Skill'){document.getElementById('title').textContent='Agent Skill';document.getElementById('sub').textContent='Sesama UI skill rules, references, and starter patterns for AI agents and developers.';grid.innerHTML=`<article class="reading">${skillNames.map(name=>`<section><h3>${name}</h3><p>${skillInfo[name].desc}</p>${skillInfo[name].body}</section>`).join('')}</article>`;return}
 if(q){const results=C.filter(x=>x[0]!=='Foundations'&&(x[1]+' '+x[0]+' '+x[2]+' '+x[3]).toLowerCase().includes(q));const foundations=foundationNames.filter(n=>(n+' '+foundationInfo[n].join(' ')).toLowerCase().includes(q));const structures=structureNames.filter(n=>(n+' '+structureInfo[n].desc+' '+structureInfo[n].body.replace(/<[^>]*>/g,' ')).toLowerCase().includes(q));const skills=skillNames.filter(n=>(n+' '+skillInfo[n].desc+' '+skillInfo[n].body.replace(/<[^>]*>/g,' ')).toLowerCase().includes(q));const count=results.length+foundations.length+structures.length+skills.length;document.getElementById('title').textContent='Search results';document.getElementById('sub').textContent=`${count} matching guideline${count===1?'':'s'}, components, or blocks.`;grid.innerHTML=count?`<article class="reading"><section><h3>Matching documentation</h3><div class="slist plain">${foundations.map(n=>`<button class="ti" data-open-page="${labelPage('Foundations',n)}"><i class="sp"></i><span class="nm">Foundations · ${n}</span></button>`).join('')}${structures.map(n=>`<button class="ti" data-open-page="Installations"><i class="sp"></i><span class="nm">Installations · ${n}</span></button>`).join('')}${skills.map(n=>`<button class="ti" data-open-page="Skill"><i class="sp"></i><span class="nm">Skill · ${n}</span></button>`).join('')}</div></section><section><h3>Components and blocks</h3><div class="slist plain">${results.map(x=>`<button class="ti" data-open-page="${labelPage(x[0],x[1])}"><i class="sp"></i><span class="nm">${x[0]} · ${x[1]}</span></button>`).join('')}</div></section></article>`:'<div class="empty">No matches. Try another term.</div>';return}
 if(page==='Icons:Essential'){
 const basic=window.CANONICAL_CONTROL_ICONS||[];
 const cell=(name,cat)=>`<div class="icon-cell" data-icon-cell="${name} ${cat||'control'}"><span class="rune-glyph" aria-hidden="true">${runeIcon(name,24)}</span><a href="../assets/rune-icons/${name}.svg" download aria-label="Download ${name} outline SVG">${name}</a><span class="hint">${cat||'control'}</span></div>`;
 document.getElementById('title').textContent='Icons';document.getElementById('sub').textContent='Rune Icons · Outline · Basic (controls) + Full set';
 grid.innerHTML=`<article class="reading"><section><h3>Basic — control icons (${basic.length})</h3><p>The curated control set rendered by <code>controlIcon()</code>; used by every component. Import: <code>import { controlIcon } from 'sesama-ui/icons'</code>.</p>${basic.length?'':'<p class="hint" id="icon-basic-loading">Loading basic control icons…</p>'}</section>${basic.length?`<section><div class="icon-gallery">${basic.map(n=>cell(n,'control')).join('')}</div></section>`:''}<section><h3>Full — Rune set (${RUNE_ICONS.length})</h3><p>Library: <a href="https://www.runeicons.com/" target="_blank" rel="noreferrer">Rune Icons</a>. Rune SVG assets are bundled locally under Apache 2.0. Ellipsis icons are Sesama additions. Import: <code>import { runeIcon } from 'sesama-ui/icons/rune-icons'</code>.</p><pre class="imp">runeIcon('search', 24) // outline</pre><p>Use currentColor for theme-aware icons. Icon-only buttons require an aria-label.</p></section><section><div class="sx-row"><label class="field" style="margin-bottom:var(--space-16)"><input data-icon-search placeholder="Search icons…" aria-label="Search icons"></label></div><div class="icon-gallery">${RUNE_ICONS.map(icon=>cell(icon.name,icon.category)).join('')}</div><p id="icon-empty" hidden>No icons match your search.</p></section></article>`;return;
 }
 if(page==='Home'){
  document.getElementById('title').textContent='';document.getElementById('title').hidden=true;document.getElementById('sub').textContent='A practical guide to the UI patterns used across Sesama.';
  const heroHighlightNames=['Button','Chart','Canvas','Composer','Avatar','Select','File card','Menu','Status dot'];
  const homeComponents=document.documentElement.dataset.embed==='hero'?heroHighlightNames.map(name=>C.find(item=>item[1].toLowerCase()===name.toLowerCase())).filter(Boolean):components;
  grid.innerHTML=`<div class="home-gallery">${homeComponents.map(x=>`<article class="home-tile ${x[1]==='Canvas'?'home-canvas-tile':''}"><button class="tile-title" data-open-page="${labelPage(x[0],x[1])}">${x[1]}</button><div class="stage">${window.canonicalHomePreview?.(x[1])||''}</div></article>`).join('')}</div>`;
  return;
 }
 detail(page);
}
document.addEventListener('click',e=>{
 if(e.target.closest('#theme')){const r=document.documentElement,d=r.dataset.mode?r.dataset.mode==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.mode=d?'light':'dark';document.getElementById('theme').setAttribute('aria-checked',String(!d));return}
 const b=e.target.closest('[data-page]');if(b)navigatePage(b.dataset.page);
});
grid.addEventListener('click',e=>{const a=e.target.closest('[data-open-page]');if(a){e.preventDefault();navigatePage(a.dataset.openPage)}});
addEventListener('hashchange',()=>{const next=pageFromHash();if(next===page)return;page=next;q='';paint();window.scrollTo(0,0)});
grid.addEventListener('click',event=>{const button=event.target.closest('button[data-icon-style]');if(button){iconStyle=button.dataset.iconStyle;paint()}});
grid.addEventListener('input',event=>{if(!event.target.matches('[data-icon-search]'))return;const query=event.target.value.trim().toLowerCase();let count=0;grid.querySelectorAll('[data-icon-cell]').forEach(cell=>{cell.hidden=!cell.dataset.iconCell.includes(query);if(!cell.hidden)count++});document.getElementById('icon-empty').hidden=count>0});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();paint()});
const genericMetadata={Input:'base control; text, email, number, URL, icon, sizes and states','Input Field':'labelled text, password and phone; optional helper and error',Label:'neutral, informative, success, error, disabled',Badge:'neutral, informative, success, error, disabled',Chip:'neutral, informative, success, error, disabled',Avatar:'16px, 24px; selectable, selected, disabled',Card:'framed, bare, selected, expandable, with status','Tree item':'navigation, with icon, nested, collapsed, selected',Breadcrumbs:'plain, with icons'};
C.filter(x=>x[0]==='Components').forEach(x=>{if(genericMetadata[x[1]])x[3]=genericMetadata[x[1]];});
paint();
function sendCatalogSummary(){parent.postMessage({type:'sesama:catalog-summary',counts:{components:new Set(C.filter(item=>item[0]==='Components').map(item=>item[1])).size,blocks:new Set(C.filter(item=>item[0]==='Blocks').map(item=>item[1])).size,icons:RUNE_ICONS.length,foundations:foundationNames.length}},'*')}
if(document.documentElement.dataset.embed==='hero'){sendCatalogSummary();window.addEventListener('message',event=>{if(event.source===parent&&event.data?.type==='sesama:catalog-summary-request')sendCatalogSummary()})}
</script>
