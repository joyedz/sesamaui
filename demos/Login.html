<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Sesama</title>
  <link rel="stylesheet" href="../src/styles/components.css">
  <link rel="stylesheet" href="../src/styles/fonts.css">
  <style>
    body.sui-root { margin: 0; min-height: 100dvh; background: var(--color-base); }
    .login-shell { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding: 8px; height: 100dvh; min-height: 600px; }
    .login-panel, .login-art { border-radius: 12px; box-shadow: var(--shadow-ring); background: var(--color-base); min-width: 0; overflow: hidden; }
    .login-panel { position: relative; display: flex; flex-direction: column; padding: 48px 24px 24px; overflow-y: auto; background: transparent; box-shadow: none; border-radius: 0; }
    .login-theme { position: absolute; top: 16px; right: 16px; }
    .login-center { margin-block: auto; display: flex; flex-direction: column; align-items: center; gap: 40px; padding-block: 40px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 22px; line-height: 28px; letter-spacing: -0.6px; font-weight: 500; color: var(--text-default); text-decoration: none; }
    .brand-mark { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; width: 25px; height: 25px; rotate: -8deg; }
    .brand-mark i { border-radius: 3px; background: var(--color-brand); }
    .brand-mark i:nth-child(2) { border-top-right-radius: 8px; }
    .brand-mark i:nth-child(3) { border-bottom-left-radius: 8px; }
    .auth { width: 100%; max-width: 320px; }
    .auth h1, .auth-description { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .auth form { display: grid; gap: 16px; margin: 0; }
    .auth .form-field { max-width: none; }
    .auth .submit { width: 100%; }
    .login-signup { font-size: 13px; line-height: 20px; color: var(--text-subtle); text-align: center; margin: 24px 0 0; }
    .login-footer { font-size: 11px; line-height: 16px; text-align: center; color: var(--text-placeholder); padding-top: 24px; }
    .login-art { position: relative; isolation: isolate; background: #1d2030; }
    .login-art:before { content: ''; position: absolute; inset: -20%; background: radial-gradient(ellipse at 75% 10%, #f1bda0 0, transparent 38%), radial-gradient(ellipse at 10% 65%, #d7a190 0, transparent 40%), radial-gradient(ellipse at 80% 80%, #263b65 0, transparent 50%), linear-gradient(155deg, #8792a5 0%, #e3b5a0 32%, #727c99 50%, #39455e 65%, #1b263b 100%); filter: blur(22px); transform: rotate(-12deg) scale(1.1); }
    .login-art:after { content: ''; position: absolute; inset: -20%; background: repeating-linear-gradient(155deg, transparent 0 100px, #f5d7bb15 130px, transparent 160px 280px); filter: blur(18px); transform: rotate(-9deg); }
    .login-art-grain { position: absolute; inset: 0; opacity: 0.06; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' opacity='.7' d='M0 0h180v180H0z'/%3E%3C/svg%3E"); mix-blend-mode: soft-light; z-index: 1; }
    .login-social { display: grid; gap: 12px; }
    .login-social > .btn { width: 100%; }
    .login-divider { display: flex; align-items: center; gap: 12px; color: var(--text-placeholder); font-size: 11px; line-height: 16px; margin: 24px 0; }
    .login-divider:before, .login-divider:after { content: ""; height: 1px; flex: 1; background: var(--color-hairline); }
    @media(max-width:1000px){
      .login-shell { grid-template-columns: minmax(0, 1fr); }
      .login-art { display: none; }
    }
    @media(max-width:500px){
      .login-shell { min-height: 100dvh; height: auto; }
      .login-panel { min-height: calc(100dvh - 16px); padding-inline: 24px; border-radius: 8px; }
      .login-center { gap: 32px; }
    }
  </style>
</head>
<body class="sui-root">
  <main class="login-shell">
    <div class="login-panel">
      <div id="theme-control" class="login-theme"></div>
      <div class="login-center">
        <a class="brand" href="../Sesama%20landing.html">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>sesama<span style="font-size:11px;letter-spacing:0;color:var(--text-subtle)">UI</span>
        </a>
        <section class="auth" aria-labelledby="login-title">
          <h1 id="login-title">Sign in to Sesama</h1>
          <p class="auth-description">Enter your email and password to continue.</p>
          <div class="login-social" id="login-social"></div>
          <div class="login-divider"><span>or continue with email</span></div>
          <form id="login" novalidate></form>
          <p class="login-signup">Don’t have an account? <span id="sign-up-control"></span></p>
        </section>
      </div>
      <footer class="login-footer">© 2026 Sesama UI</footer>
    </div>
    <aside class="login-art" aria-label="Abstract dusk landscape">
      <div class="login-art-grain"></div>
    </aside>
  </main>

  <script type="module">
    import {
      socialButton,
      iconButton,
      inputField,
      linkButton,
      button,
      showToast,
      mount
    } from '../src/index.mjs';

    document.getElementById('login-social').innerHTML =
      socialButton({ provider: 'google', attributes: 'data-login-provider="Google"' }) +
      socialButton({ provider: 'github', attributes: 'data-login-provider="GitHub"' });

    document.getElementById('theme-control').innerHTML =
      iconButton({ icon: 'sun', id: 'theme', attributes: 'id="theme"', accessibleLabel: 'Toggle theme' });

    document.getElementById('login').innerHTML =
      inputField({
        id: 'email',
        name: 'email',
        label: 'Email',
        type: 'email',
        autocomplete: 'username',
        placeholder: 'name@company.com',
        required: true,
        errorSlot: true,
        size: 'base'
      }) +
      inputField({
        id: 'password',
        name: 'password',
        label: 'Password',
        type: 'password',
        autocomplete: 'current-password',
        placeholder: 'Enter your password',
        required: true,
        errorSlot: true,
        size: 'base'
      }) +
      linkButton({ label: 'Forgot your password?', attributes: 'id="forgot-password"' }) +
      button({ label: 'Sign in', type: 'submit', variant: 'primary', size: 'base', classes: 'submit' });

    document.getElementById('sign-up-control').innerHTML =
      linkButton({ label: 'Sign up', tone: 'brand', attributes: 'id="sign-up"' });

    mount(document.body);

    document.addEventListener('click', event => {
      const provider = event.target.closest('[data-login-provider]');
      if (provider) {
        showToast(provider.dataset.loginProvider + ' sign-in is not connected.', 'informative');
      }
    });

    const form = document.getElementById('login');
    const email = document.getElementById('email');
    const password = document.getElementById('password');

    function validate(input) {
      const message = !input.value.trim()
        ? (input === email ? 'Enter your email address.' : 'Enter your password.')
        : (input === email && !input.validity.valid ? 'Enter a valid email address.' : '');

      const error = document.getElementById(input.id + '-message');
      if (error) {
        error.textContent = message;
        error.hidden = !message;
      }
      input.setAttribute('aria-invalid', String(!!message));
      return !message;
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const validEmail = validate(email);
      const validPassword = validate(password);
      if (!validEmail || !validPassword) {
        (!validEmail ? email : password).focus();
        return;
      }
      showToast('Form validated. Authentication is not connected.', 'informative');
    });

    [email, password].forEach(input => {
      input.addEventListener('input', () => {
        if (input.getAttribute('aria-invalid') === 'true') validate(input);
      });
    });

    document.getElementById('theme').addEventListener('click', () => {
      const root = document.documentElement;
      const dark = root.dataset.mode ? root.dataset.mode === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
      root.dataset.mode = dark ? 'light' : 'dark';
    });

    document.getElementById('forgot-password').addEventListener('click', () => {
      showToast('Password recovery is not connected.', 'informative');
    });

    document.getElementById('sign-up').addEventListener('click', () => {
      showToast('Account registration is not connected.', 'informative');
    });
  </script>
</body>
</html>
