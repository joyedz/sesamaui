<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sesama · Agents</title>
  <link rel="stylesheet" href="../src/styles/components.css">
  <link rel="stylesheet" href="../src/styles/blocks.css">
  <link rel="stylesheet" href="../src/styles/fonts.css">
  <style>
    html, body { height: 100%; margin: 0; }
    .agent-app { height: 100dvh; display: grid; grid-template-columns: 240px minmax(0,1fr); background: var(--color-canvas); padding: var(--space-8); gap: var(--space-8); box-sizing: border-box; transition: grid-template-columns 320ms var(--ease-out); }
    .agent-app.has-details { grid-template-columns: 240px minmax(0,1fr) 300px; }
    .agent-sidebar { display: flex; flex-direction: column; gap: var(--space-16); padding: var(--space-8); background: none; min-height: 0; overflow-x: hidden; }
    .agent-brand { display: flex; align-items: center; gap: 8px; height: 28px; font-size: 12px; font-weight: 500; }
    .agent-profile .sb-profile-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .agent-brand > [data-sui-select], .agent-brand > [data-select-demo] { flex: 1; min-width: 0; }
    .agent-brand .form-field { gap: 0; max-width: none; }
    .agent-brand .sx-select-trigger { width: 100%; }
    .agent-brand > #toggle-sidebar { flex: none; }
    .agent-history { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
    .agent-nav { display: block; }
    .agent-profile { display: flex; align-items: center; gap: var(--space-8); padding: var(--space-8) 0 0; border-top: 1px solid var(--color-hairline); }
    .agent-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-radius: var(--radius-md); background: var(--color-base); box-shadow: var(--shadow-ring); overflow: hidden; }
    .agent-header { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: var(--space-8) var(--space-12); border-bottom: 1px solid var(--color-hairline); flex: none; }
    .agent-chat { flex: 1; min-height: 0; overflow-y: auto; --chat-fade-top: 0px; --chat-fade-bottom: 0px; mask-image: linear-gradient(to bottom, transparent 0, #000 var(--chat-fade-top), #000 calc(100% - var(--chat-fade-bottom)), transparent 100%); }
    .agent-chat.has-scroll-above { --chat-fade-top: 28px; }
    .agent-chat.has-scroll-below { --chat-fade-bottom: 36px; }
    .agent-thread { width: 100%; max-width: 768px; margin: auto; padding: var(--space-24); display: grid; gap: var(--space-24); --message-width: 100%; box-sizing: border-box; }
    .agent-compose { padding: var(--space-12); flex: none; background: var(--color-base); position: relative; z-index: 1; }
    .agent-compose-inner { max-width: 720px; margin: auto; }
    .agent-note { font-size: 10px; text-align: center; color: var(--text-placeholder); margin: 8px 0 0; }
    .agent-detail { grid-column: 3; grid-row: 1; width: 300px; min-height: 0; overflow: auto; border-radius: var(--radius-md); box-shadow: var(--shadow-ring); padding: var(--space-12); background: var(--color-base); }
    .agent-detail[hidden] { display: none; }
    .agent-detail h2 { font-size: 13px; margin: 0; }
    .agent-detail dl { display: grid; grid-template-columns: 1fr auto; gap: 16px; margin: 24px 0 0; }
    .agent-detail dt { color: var(--text-subtle); }
    .agent-detail dd { margin: 0; }
    .project-rail-button { display: none; }

    .agent-main.is-new-chat .agent-chat { display: none; }
    .agent-main.is-new-chat .agent-compose { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; }
    .agent-greeting { width: 100%; max-width: 720px; text-align: center; margin: 0 auto 24px; }
    .agent-greeting h1 { font-size: 24px; line-height: 32px; font-weight: 500; margin: 0 0 8px; }
    .agent-greeting[hidden] { display: none; }

    @media(min-width:761px){
      .agent-app.sidebar-collapsed { grid-template-columns: 48px minmax(0,1fr); }
      .agent-app.sidebar-collapsed.has-details { grid-template-columns: 48px minmax(0,1fr) 300px; }
      .agent-main { grid-column: 2; grid-row: 1; }
      .sidebar-collapsed .agent-sidebar { position: fixed; left: 8px; top: 8px; bottom: 8px; width: 48px; z-index: 40; background: var(--color-canvas); border-radius: var(--radius-md); overflow: hidden; transition: width 320ms var(--ease-out); }
      .sidebar-collapsed .agent-sidebar.sidebar-hover-open { width: 240px; box-shadow: var(--shadow-float); }
      .sidebar-collapsed .agent-sidebar:not(.sidebar-hover-open) .agent-brand > [data-sui-select],
      .sidebar-collapsed .agent-sidebar:not(.sidebar-hover-open) .sx-tree-label,
      .sidebar-collapsed .agent-sidebar:not(.sidebar-hover-open) #project-section > .sx-tree-section,
      .sidebar-collapsed .agent-sidebar:not(.sidebar-hover-open) .agent-profile > span:not(#sidebar-avatar),
      .sidebar-collapsed .agent-sidebar:not(.sidebar-hover-open) .agent-profile > .sx-row { display: none; }
      .sidebar-collapsed .agent-sidebar:not(.sidebar-hover-open) .project-rail-button { display: grid; margin: 4px auto; }
      .sidebar-collapsed .agent-sidebar:not(.sidebar-hover-open) .ti { padding: 6px; justify-content: center; min-width: 32px; }
      .sidebar-collapsed .agent-sidebar:not(.sidebar-hover-open) .agent-brand { justify-content: center; }
      .sidebar-collapsed .agent-sidebar:not(.sidebar-hover-open) .agent-profile { justify-content: center; }
    }

    @media(max-width:1000px){
      .agent-app, .agent-app.has-details { grid-template-columns: 240px minmax(0,1fr); }
      .agent-app.sidebar-collapsed, .agent-app.sidebar-collapsed.has-details { grid-template-columns: 48px minmax(0,1fr); }
      .agent-detail { position: fixed; top: var(--space-8); right: var(--space-8); bottom: var(--space-8); z-index: 30; box-shadow: var(--shadow-float); }
    }
    @media(prefers-reduced-motion:reduce){
      .agent-app, .sidebar-collapsed .agent-sidebar { transition: none !important; }
    }
    @media(max-width:760px){
      .agent-app, .agent-app.has-details { grid-template-columns: minmax(0,1fr); }
      .agent-sidebar { display: none; }
      .agent-sidebar.is-open { display: flex; position: fixed; inset: var(--space-8) auto var(--space-8) var(--space-8); width: 240px; z-index: 20; background: var(--color-canvas); box-shadow: var(--shadow-float); padding: var(--space-12); }
      .agent-thread { padding: var(--space-16); }
      .agent-header { padding: var(--space-8); }
      .agent-compose { padding: var(--space-8); }
    }
  </style>
</head>
<body class="sui-root">
  <div class="agent-app">
    <aside class="agent-sidebar" id="sidebar">
      <div class="agent-brand" id="workspace-selector"></div>
      <nav id="new-chat-navigation" aria-label="Conversation actions"></nav>
      <section class="agent-history sx-scroll-area">
        <div id="project-section"></div>
      </section>
      <div id="sidebar-profile-host"></div>
    </aside>

    <main class="agent-main">
      <header class="agent-header">
        <div class="sx-row">
          <span data-icon="chat"></span>
          <strong id="agent-name" style="font-weight:500">Project brief summary</strong>
        </div>
      </header>
      <div class="agent-chat sx-scroll-area" id="chat">
        <div class="agent-thread" id="thread"></div>
      </div>
      <footer class="agent-compose">
        <div class="agent-greeting" id="greeting" hidden>
          <h1>Let’s think it through.</h1>
        </div>
        <div class="agent-compose-inner" id="compose"></div>
        <p class="agent-note">Sesama UI demo · responses and integrations are simulated.</p>
      </footer>
    </main>

    <aside class="agent-detail" id="detail" hidden>
      <div class="sx-row" style="justify-content:space-between">
        <h2>Run details</h2>
        <button class="ibtn" id="close-detail" aria-label="Close details"></button>
      </div>
      <dl>
        <dt>Status</dt><dd>Complete</dd>
        <dt>Agent</dt><dd>Research agent</dd>
        <dt>Sources</dt><dd>3 sample documents</dd>
        <dt>Duration</dt><dd>12 seconds</dd>
      </dl>
    </aside>
  </div>

  <script type="module">
    import {
      message,
      composer as composerBuilder,
      agentRun,
      fileCard,
      tree,
      treeSection,
      select,
      iconButton,
      button,
      inputField,
      avatar,
      initModal,
      showToast,
      controlIcon,
      escapeHTML,
      mount
    } from '../src/index.mjs';
    import { aiAgentConversations } from './shared/data.mjs';

    const glyph = (name, size = 16) => controlIcon(name, size);

    document.querySelectorAll('[data-icon]').forEach(n => {
      n.innerHTML = glyph(n.dataset.icon || 'chat', 16);
    });
    document.getElementById('close-detail').innerHTML = glyph('x', 14);

    document.getElementById('workspace-selector').innerHTML =
      select({
        name: 'workspace',
        ariaLabel: 'Workspace',
        hideLabel: true,
        inline: true,
        icon: 'folder',
        value: 'Sesama workspace',
        groups: [{
          label: 'Your workspaces',
          options: [
            { label: 'Sesama workspace', icon: 'folder' },
            { label: 'Personal workspace', icon: 'circle-user' },
            { label: 'Design team', icon: 'image' }
          ]
        }],
        actions: [{ key: 'create-workspace', label: 'Create workspace', icon: 'plus' }]
      }) +
      iconButton({
        icon: 'panel',
        id: 'toggle-sidebar',
        attributes: 'id="toggle-sidebar" aria-expanded="true"',
        accessibleLabel: 'Hide sidebar'
      });

    const sidebarApp = document.querySelector('.agent-app');
    const sidebar = document.getElementById('sidebar');
    let sidebarHoverReady = true;
    let sidebarHoverTimer, sidebarCloseTimer;

    sidebar.addEventListener('pointerleave', () => {
      clearTimeout(sidebarHoverTimer);
      clearTimeout(sidebarCloseTimer);
      sidebarHoverReady = true;
      sidebarCloseTimer = setTimeout(() => sidebar.classList.remove('sidebar-hover-open'), 200);
    });

    sidebar.addEventListener('pointerenter', () => {
      clearTimeout(sidebarCloseTimer);
      clearTimeout(sidebarHoverTimer);
      if (sidebarHoverReady && sidebarApp.classList.contains('sidebar-collapsed')) {
        sidebarHoverTimer = setTimeout(() => {
          if (sidebarHoverReady && sidebar.matches(':hover') && sidebarApp.classList.contains('sidebar-collapsed')) {
            sidebar.classList.add('sidebar-hover-open');
          }
        }, 200);
      }
    });

    sidebar.addEventListener('focusin', event => {
      if (event.target.id !== 'toggle-sidebar' && sidebarHoverReady && sidebarApp.classList.contains('sidebar-collapsed')) {
        sidebar.classList.add('sidebar-hover-open');
      }
    });

    document.getElementById('toggle-sidebar').onclick = () => {
      clearTimeout(sidebarHoverTimer);
      clearTimeout(sidebarCloseTimer);
      const collapsed = sidebarApp.classList.toggle('sidebar-collapsed');
      const btn = document.getElementById('toggle-sidebar');
      btn.setAttribute('aria-expanded', String(!collapsed));
      btn.setAttribute('aria-label', collapsed ? 'Show sidebar' : 'Hide sidebar');
      sidebar.classList.remove('sidebar-hover-open');
      sidebarHoverReady = !collapsed;
      if (collapsed) btn.blur();
    };

    document.getElementById('sidebar-profile-host').innerHTML = `
      <footer class="agent-profile">
        ${avatar({ name: 'Nils Eller', initials: 'N', size: 24, color: 'auto', attributes: 'id="sidebar-avatar"' })}
        <span class="sb-profile-name">Nils Eller</span>
        <div class="sx-row">
          ${iconButton({ icon: 'sun', accessibleLabel: 'Toggle theme', attributes: 'id="theme-btn"' })}
          ${iconButton({ icon: 'bell', accessibleLabel: 'Notifications', attributes: 'data-toast="No new notifications."' })}
        </div>
      </footer>
    `;

    document.addEventListener('click', event => {
      const toast = event.target.closest('[data-toast]');
      if (toast) showToast(toast.dataset.toast, 'informative');
    });

    document.addEventListener('sui:message:action', event => {
      const action = event.detail?.action || '';
      if (action === 'regenerate') showToast('Regenerate response · simulated demo.', 'informative');
      if (action === 'helpful') showToast('Feedback recorded. Thank you!', 'success');
    });

    const thread = document.getElementById('thread');
    const chat = document.getElementById('chat');

    document.getElementById('new-chat-navigation').innerHTML = tree([
      { id: 'new-chat', key: 'new-chat', label: 'New chat', icon: 'plus' },
      { id: 'search-chats', key: 'search-chats', label: 'Search conversations', icon: 'search' },
      { id: 'all-agents', key: 'all-agents', label: 'All agents', icon: 'sparkles' },
      { id: 'workspace-files', key: 'workspace-files', label: 'Workspace files', icon: 'folder' }
    ]);

    document.querySelector('[data-tree-key="new-chat"]')?.setAttribute('id', 'new-chat');

    document.getElementById('new-chat-navigation').addEventListener('click', event => {
      const item = event.target.closest('[data-tree-key]');
      if (!item || item.dataset.treeKey === 'new-chat') return;
      if (item.dataset.treeKey === 'all-agents') {
        showToast('Agent directory · demo');
        return;
      }
      if (item.dataset.treeKey === 'search-chats') {
        let search = document.getElementById('chat-search');
        if (!search) {
          const wrapper = document.createElement('label');
          wrapper.className = 'field';
          wrapper.style.width = '100%';
          wrapper.innerHTML = '<input id="chat-search" aria-label="Search conversations" placeholder="Search conversations…">';
          document.getElementById('history').before(wrapper);
          search = wrapper.querySelector('input');
          search.addEventListener('input', () => {
            document.querySelectorAll('#history [data-tree-key]').forEach(row => {
              row.hidden = !row.textContent.toLowerCase().includes(search.value.toLowerCase());
            });
          });
        }
        search.focus();
        return;
      }
      showToast('Workspace files · demo');
    });

    function outgoing(text, files = []) {
      document.querySelector('.agent-main').classList.remove('is-new-chat');
      document.getElementById('greeting').hidden = true;

      const attachmentsHTML = files.map(card => {
        return fileCard({
          name: card.name || 'document',
          type: card.type || 'text',
          preview: card.src || ''
        });
      }).join('');

      const msgHTML = message({
        role: 'user',
        own: true,
        status: 'sent',
        content: escapeHTML(text),
        attachments: attachmentsHTML
      });

      const t = document.createElement('template');
      t.innerHTML = msgHTML.trim();
      const node = t.content.firstElementChild;
      thread.append(node);
      mount(node);
    }

    function answer(text) {
      const runHTML = agentRun({
        title: 'Sample agent run',
        state: 'completed',
        steps: [
          { type: 'thinking', title: 'Thinking', state: 'completed', detail: 'Reviewed the request and identified the context needed for the response. Sample progress summary.' },
          { type: 'tool', name: 'Search browser', iconName: 'search', state: 'completed', input: 'Find relevant project documentation', output: '3 sample reference documents found.' },
          { type: 'tool', name: 'Run command', iconName: 'code', state: 'completed', input: 'npm run test', output: 'Sample output: 12 tests passed. Exit code: 0' }
        ]
      });

      const msgHTML = message({
        role: 'agent',
        content: runHTML + `<div data-message-content><p>${escapeHTML(text)}</p></div>`,
        actions: [
          { action: 'copy', icon: 'copy', label: 'Copy response' },
          { action: 'regenerate', icon: 'refresh-cw', label: 'Regenerate response' },
          { action: 'helpful', icon: 'thumbs-up', label: 'Helpful response' }
        ]
      });

      const t = document.createElement('template');
      t.innerHTML = msgHTML.trim();
      const node = t.content.firstElementChild;
      thread.append(node);
      mount(node);
    }

    outgoing('Summarize the project brief and suggest next steps.');
    answer('The brief outlines the main goals and scope. Next, confirm priorities, assign milestone owners, and agree on a timeline. Validate the scope first to keep implementation focused.');

    document.getElementById('compose').innerHTML = composerBuilder({
      placeholder: 'Ask a question or assign a task…',
      contextOptions: ['Base', 'feature/torque-420'],
      contextValue: 'Base'
    });

    const composerEl = document.getElementById('compose').querySelector('.composer, [data-sui-composer]');
    let pending, thinkingNode;
    const composerSend = composerEl.querySelector('[data-send]');

    function resetSend() {
      composerSend.removeAttribute('data-agent-stop');
      composerSend.setAttribute('data-send', '');
      composerSend.setAttribute('aria-label', 'Send comment');
      composerSend.innerHTML = glyph('up', 14);
      composerSend.disabled = !composerEl.querySelector('textarea').value.trim();
    }

    composerEl.querySelector('textarea')?.addEventListener('input', e => {
      composerSend.disabled = !e.target.value.trim();
    });

    composerEl.addEventListener('click', event => {
      const stop = event.target.closest('[data-agent-stop]');
      if (stop) {
        event.stopPropagation();
        clearTimeout(pending);
        thinkingNode?.remove();
        resetSend();
        showToast('Response stopped.');
        return;
      }

      const send = event.target.closest('[data-send]');
      if (!send || send.disabled) return;

      const input = composerEl.querySelector('textarea');
      const value = input.value.trim();
      const list = composerEl.querySelector('[data-composer-attachments]');
      const files = list ? [...list.querySelectorAll('.fcard')] : [];
      if (!value && !files.length) return;

      event.stopPropagation();
      outgoing(value, files);
      if (list) {
        list.replaceChildren();
        list.hidden = true;
      }
      input.value = '';
      input.style.height = 'auto';

      send.removeAttribute('data-send');
      send.setAttribute('data-agent-stop', '');
      send.setAttribute('aria-label', 'Stop response');
      send.innerHTML = '<span class="composer-stop-square" aria-hidden="true"></span>';
      send.disabled = false;

      const thinkHTML = message({ role: 'agent', status: 'thinking' });
      const t = document.createElement('template');
      t.innerHTML = thinkHTML.trim();
      thinkingNode = t.content.firstElementChild;
      thread.append(thinkingNode);
      chat.scrollTop = chat.scrollHeight;

      clearTimeout(pending);
      pending = setTimeout(() => {
        thinkingNode?.remove();
        answer('I have received your request. This response is simulated. The same workflow can connect your agent to models, documents, and tools.');
        resetSend();
        chat.scrollTop = chat.scrollHeight;
      }, 1500);
    });

    function updateChatFade() {
      chat.classList.toggle('has-scroll-above', chat.scrollTop > 2);
      chat.classList.toggle('has-scroll-below', chat.scrollHeight - chat.clientHeight - chat.scrollTop > 2);
    }
    chat.addEventListener('scroll', updateChatFade, { passive: true });
    new ResizeObserver(updateChatFade).observe(chat);
    new MutationObserver(() => requestAnimationFrame(updateChatFade)).observe(thread, { childList: true, subtree: true });

    const conversationViews = new Map();
    let activeConversation = null;

    function openConversation(key, title) {
      document.querySelector('.agent-main').classList.remove('is-new-chat');
      document.getElementById('greeting').hidden = true;
      clearTimeout(pending);
      thinkingNode?.remove();
      if (activeConversation) conversationViews.set(activeConversation, [...thread.childNodes]);
      thread.replaceChildren();
      activeConversation = key;
      resetSend();
      if (conversationViews.has(key)) {
        thread.append(...conversationViews.get(key));
      } else {
        for (const [question, response] of aiAgentConversations[key] || []) {
          outgoing(question);
          answer(response);
        }
      }
      document.getElementById('agent-name').textContent = title;
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('project-section').innerHTML = treeSection('Projects', '<nav class="agent-nav" id="history"></nav>', {
      actionIcon: 'plus',
      actionLabel: 'Add project',
      actionAttributes: 'id="add-project"'
    });

    const history = document.getElementById('history');
    history.innerHTML = tree([
      {
        id: 'project-sesama',
        key: 'project-sesama',
        label: 'Sesama workspace',
        icon: 'folder',
        children: [
          { id: 'history-office', key: 'history-office', label: 'Plan team priorities this week', icon: false },
          { id: 'history-coding', key: 'history-coding', label: 'Connect the agent to our API', icon: false },
          { id: 'history-design', key: 'history-design', label: 'Review the design system · long conversation', icon: false }
        ]
      },
      {
        id: 'project-website',
        key: 'project-website',
        label: 'Website launch',
        icon: 'folder',
        expanded: false,
        children: [
          { id: 'website-office', key: 'website-office', label: 'Prepare the launch checklist', icon: false },
          { id: 'website-coding', key: 'website-coding', label: 'Fix the landing page layout', icon: false },
          { id: 'website-design', key: 'website-design', label: 'Explore homepage ideas', icon: false }
        ]
      },
      {
        id: 'project-tools',
        key: 'project-tools',
        label: 'Internal tools',
        icon: 'folder',
        expanded: false,
        children: [
          { id: 'tools-office', key: 'tools-office', label: 'Summarize operations requirements', icon: false },
          { id: 'tools-coding', key: 'tools-coding', label: 'Add table filters', icon: false },
          { id: 'tools-design', key: 'tools-design', label: 'Simplify the dashboard', icon: false }
        ]
      }
    ]);

    history.addEventListener('click', event => {
      const item = event.target.closest('[data-tree-key]');
      if (!item || item.hasAttribute('data-fold')) return;
      openConversation(item.dataset.treeKey, item.textContent.trim());
    });

    document.getElementById('project-section').insertAdjacentHTML('afterbegin', iconButton({ icon: 'kebab', classes: 'project-rail-button', accessibleLabel: 'Projects' }));
    document.querySelector('.project-rail-button').onclick = () => {
      sidebarApp.classList.remove('sidebar-collapsed');
      document.getElementById('toggle-sidebar').setAttribute('aria-expanded', 'true');
    };

    document.getElementById('add-project').onclick = event => {
      const trigger = event.currentTarget;
      const dialog = document.createElement('dialog');
      dialog.className = 'ds-modal';
      dialog.setAttribute('aria-labelledby', 'add-project-title');
      dialog.innerHTML = `
        <div class="sx-modal-header">
          <h2 id="add-project-title">New project</h2>
          ${iconButton({ icon: 'x', classes: 'sx-modal-close', attributes: 'data-modal-close', accessibleLabel: 'Close dialog' })}
        </div>
        <form>
          <div style="display:grid;gap:16px;padding:16px 0;">
            ${inputField({ id: 'project-name', label: 'Project name', placeholder: 'Project name', required: true })}
          </div>
          <div class="actions">
            <button type="button" class="btn secondary" data-modal-close>Cancel</button>
            <button class="btn primary" type="submit">Create project</button>
          </div>
        </form>
      `;
      document.body.append(dialog);
      const modalInstance = initModal(dialog);

      dialog.querySelector('form').onsubmit = e => {
        e.preventDefault();
        const name = dialog.querySelector('input').value.trim();
        if (!name) return;
        history.insertAdjacentHTML('beforeend', tree([{ id: 'project-' + Date.now(), label: name, icon: 'folder', children: [] }]));
        modalInstance.close();
        showToast('Project created.', 'success');
      };

      dialog.addEventListener('close', () => {
        modalInstance.destroy();
        dialog.remove();
      }, { once: true });

      modalInstance.open(trigger);
    };

    document.getElementById('new-chat').onclick = () => {
      clearTimeout(pending);
      thinkingNode?.remove();
      if (activeConversation) conversationViews.set(activeConversation, [...thread.childNodes]);
      activeConversation = null;
      thread.replaceChildren();
      document.getElementById('agent-name').textContent = 'New chat';
      document.querySelector('.agent-main').classList.add('is-new-chat');
      document.getElementById('greeting').hidden = false;
      const textarea = composerEl.querySelector('textarea');
      if (textarea) {
        textarea.value = '';
        textarea.style.height = 'auto';
        resetSend();
        textarea.focus();
      }
    };

    const detail = document.getElementById('detail');
    const detailTrigger = document.getElementById('run-detail');
    if (detailTrigger) {
      detailTrigger.onclick = () => {
        detail.hidden = !detail.hidden;
        document.querySelector('.agent-app').classList.toggle('has-details', !detail.hidden);
        detailTrigger.setAttribute('aria-expanded', String(!detail.hidden));
      };
    }
    document.getElementById('close-detail').onclick = () => {
      detail.hidden = true;
      document.querySelector('.agent-app').classList.remove('has-details');
      detailTrigger?.setAttribute('aria-expanded', 'false');
    };

    document.getElementById('theme-btn')?.addEventListener('click', () => {
      const root = document.documentElement;
      const dark = root.dataset.mode ? root.dataset.mode === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
      root.dataset.mode = dark ? 'light' : 'dark';
    });

    mount(document.body);
  </script>
</body>
</html>
