<!doctype html><html lang="id" data-mode="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporting Penjualan · Sesama</title><link rel="stylesheet" href="../src/styles/sesama-ui.css"><link rel="stylesheet" href="../src/styles/forms.css"><link rel="stylesheet" href="../src/styles/dashboard-components.css"><link rel="stylesheet" href="../src/styles/library.css"><style>.channel{margin-top:var(--space-24)}.channel-line{display:flex;justify-content:space-between;gap:var(--space-8)}.track{height:6px;background:var(--color-recessed);border-radius:var(--radius-xs);margin-top:var(--space-8);overflow:hidden}.track i{display:block;height:100%;background:var(--color-brand)}.meta,.foot{font-size:var(--font-meta-size);color:var(--text-subtle)}.foot{margin-top:var(--space-16)}</style><script src="../src/legacy/rune-icons.js"></script><script src="../src/legacy/component-builders.js"></script><script src="../src/legacy/library.js"></script><script src="../src/legacy/workspace-blocks.js"></script><script src="../src/legacy/charts.js"></script><script defer src="../src/legacy/forms.js"></script><script defer src="../src/legacy/dashboard-components.js"></script><script defer src="../src/legacy/primitives.js"></script><div id="app"></div><script>
const ui=SESAMA_UI,B=SESAMA_BLOCKS;
const tableNode=document.createElement('div');tableNode.innerHTML=ui.getExamples('Table')[0].html;const table=tableNode.querySelector('table');table.querySelector('thead').innerHTML='<tr><th>Produk</th><th>SKU</th><th>Terjual</th><th>Kontribusi</th><th>Pendapatan</th></tr>';table.querySelector('tbody').id='products';
document.querySelector('#app').innerHTML=B.appShell({sidebar:B.sidebar({workspace:'Tim penjualan',workspaces:['Tim penjualan'],navigation:[{n:'Reporting penjualan',i:'grid-3x3',key:'sales',selected:true}],profileName:'Tim penjualan',initials:'TP'}),header:B.pageHeader({title:'Reporting penjualan',icon:'grid-3x3',actions:ui.iconButton('file','','id="export"','Ekspor CSV')}),content:B.pageLayout(B.pageGrid([{html:B.dataSection({title:'Ringkasan penjualan',description:'Pantau performa bisnis dan peluang pertumbuhan.',filters:ui.select('without label',{label:'Periode',name:'period',value:'Oktober 2026',options:['Oktober 2026','September 2026','Agustus 2026']})+ui.select('without label',{label:'Channel',name:'channel',value:'Semua channel',options:['Semua channel','Marketplace','Website','Toko offline']})}),span:12},...Array.from({length:4},(_,i)=>({html:`<div id="metric-${i}"></div>`,span:3,tablet:3})),{html:B.dataSection({title:'Tren pendapatan',description:'Pendapatan harian · dalam juta rupiah',table:'<div id="chart"></div>'}),span:8},{html:B.dataSection({title:'Penjualan per channel',description:'Kontribusi terhadap pendapatan',table:'<div id="channels"></div>'}),span:4},{html:B.dataSection({title:'Produk terlaris',description:'Diurutkan berdasarkan pendapatan tertinggi',table:table.outerHTML,pagination:'<div id="summary" role="status"></div>'}),span:12},{html:'',span:12}]))});const exp=document.querySelector('#export');
const base=[['Essential Cotton Tee','ESS-001',320,76800000],['Everyday Tote Bag','ETB-002',245,61250000],['Classic Linen Shirt','CLS-003',180,54000000],['Relaxed Fit Pants','RFP-004',156,46800000],['Canvas Sneakers','CSN-005',120,45600000]];const rup=n=>'Rp'+Math.round(n).toLocaleString('id-ID');let rows=[];function render(){const period=document.querySelector('[name=period]').value,channel=document.querySelector('[name=channel]').value;const m=({'Oktober 2026':1,'September 2026':.88,'Agustus 2026':.79})[period],c=({'Semua channel':1,Marketplace:.52,Website:.31,'Toko offline':.17})[channel],f=m*c,total=284450000*f;rows=base.map(r=>[r[0],r[1],Math.round(r[2]*f),r[3]*f]);[['Pendapatan bersih',rup(total),'+13,6%'],['Pesanan',Math.round(1021*f).toLocaleString('id-ID'),'+8,2%'],['Produk terjual',Math.round(1426*f).toLocaleString('id-ID'),'+11,4%'],['Rata-rata pesanan',rup(total/Math.round(1021*f)),'+5,0%']].forEach(([label,value,change],i)=>document.querySelector('#metric-'+i).innerHTML=B.metricCard({label,value,change}));document.querySelector('#channels').innerHTML=['Marketplace','Website','Toko offline'].map((n,i)=>{const pct=channel==='Semua channel'?[52,31,17][i]:channel===n?100:0;return `<div class="channel"><div class="channel-line"><span>${n}</span><span>${pct}%</span></div><div class="track"><i style="width:${pct}%"></i></div><p class="meta">${rup(total*pct/100)}</p></div>`}).join('');document.querySelector('#products').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td class="meta">${r[1]}</td><td>${r[2]}</td><td>${(r[3]/total*100).toFixed(1)}%</td><td>${rup(r[3])}</td></tr>`).join('');document.querySelector('#summary').textContent=`5 produk · ${period} · ${channel}`;document.querySelector('#chart').innerHTML=B.revenueChart({scale:f,label:'Tren pendapatan '+period});}render();document.addEventListener('click',e=>{if(e.target.closest('[data-select-value]'))setTimeout(render,0)});exp.onclick=()=>{const csv='\uFEFFProduk,SKU,Terjual,Pendapatan\r\n'+rows.map(r=>r.join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='reporting-penjualan.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
