<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sesama · Revenue report</title><link rel="stylesheet" href="sesama-ui.css"><link rel="stylesheet" href="forms.css"><link rel="stylesheet" href="dashboard-components.css"><link rel="stylesheet" href="library.css"><script src="rune-icons.js"></script><script src="library.js"></script><script src="workspace-blocks.js"></script><script src="charts.js"></script><script src="forms.js" defer></script><script src="dashboard-components.js" defer></script><script src="primitives.js" defer></script></head><body><div id="app"></div><script>
const B=SESAMA_BLOCKS,U=SESAMA_UI,C=SESAMA_CHARTS,money=n=>new Intl.NumberFormat('en',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);
const records=Array.from({length:60},(_,i)=>{const gross=450+(i*173)%1200,discount=i%4===0?Math.round(gross*.1):0,refund=i%11===0?80:0;return {id:'ORD-'+(1040+i),date:new Date(Date.UTC(2026,8,1+i)).toISOString().slice(0,10),customer:['Northwind Labs','Blue River Co.','Oak Street Studio','Harbor Supply'][i%4],channel:['Website','Marketplace','Direct'][i%3],gross,discount,refund,net:gross-discount-refund}});
let period='Last 30 days',channel='All channels',visible=[];
const navigation=[{n:'Overview',i:'home',key:'overview'}],groups=[{title:'Sales',items:[{n:'Revenue reports',i:'grid-3x3',key:'revenue',selected:true},{n:'Orders',i:'file-text',key:'orders'},{n:'Customers',i:'users',key:'customers'}]},{title:'Team',items:[{n:'Members',i:'users',key:'members'},{n:'Workload',i:'list-filter',key:'workload'},{n:'Performance',i:'activity',key:'performance'}]}];
document.getElementById('app').innerHTML=B.appShell({sidebar:B.salesSidebar('revenue'),header:B.pageHeader({title:'Revenue report',icon:'grid-3x3'}),content:'<div id="revenue-content"></div>'});
function render(){visible=records.slice(period==='Last 7 days'?-7:-30).filter(row=>channel==='All channels'||row.channel===channel);const days=period==='Last 7 days'?7:30,previous=records.slice(-days*2,-days).filter(row=>channel==='All channels'||row.channel===channel),prior=key=>previous.reduce((n,row)=>n+row[key],0),comparison=(now,before)=>before?((now-before)/before*100>=0?'+':'')+((now-before)/before*100).toFixed(1)+'%':'New',tone=(now,before,lower=false)=>now===before?'neutral':(lower?now<before:now>before)?'success':'error';const sum=key=>visible.reduce((n,row)=>n+row[key],0),gross=sum('gross'),discount=sum('discount'),refund=sum('refund'),net=sum('net');const byDay=[...new Set(visible.map(r=>r.date))].map(date=>({label:date.slice(5),net:visible.filter(r=>r.date===date).reduce((n,r)=>n+r.net,0),gross:visible.filter(r=>r.date===date).reduce((n,r)=>n+r.gross,0)}));const breakdown=['Website','Marketplace','Direct'].map(label=>({label,revenue:visible.filter(r=>r.channel===label).reduce((n,r)=>n+r.net,0)}));const actionMenu=U.menuPopup([{label:'Export CSV',icon:'file-down',action:'report:export'},{label:'Copy link',icon:'copy',action:'report:copy'},{label:'Share',icon:'share-2',action:'report:share'}],'Report actions');const filters=U.select('without label',{label:'Period',icon:'calendar',name:'revenue-period',value:period,options:['Last 7 days','Last 30 days']})+U.select('without label',{label:'Channel',icon:'list-filter',name:'revenue-channel',value:channel,options:['All channels','Website','Marketplace','Direct']});const columns=[{key:'date',header:'Date'},{key:'id',header:'Order ID'},{key:'customer',header:'Customer'},{key:'channel',header:'Channel'},...['gross','discount','refund','net'].map(key=>({key,header:{gross:'Gross revenue',discount:'Discounts',refund:'Refunds',net:'Net revenue'}[key],align:'right',render:n=>money(n)}))];
const items=[{span:12,html:B.contentSection({title:'Revenue performance',description:'October 2026 · USD',actions:filters+U.iconButton('kebab','size-base outline',`popovertarget="${actionMenu.id}" aria-haspopup="menu"`,'Report actions')+actionMenu.html,content:''})},...[
 {label:'Net revenue',value:money(net),change:comparison(net,prior('net')),tone:tone(net,prior('net'))},
 {label:'Gross revenue',value:money(gross),change:comparison(gross,prior('gross')),tone:tone(gross,prior('gross'))},
 {label:'Discounts',value:money(discount),description:'Discount rate '+(gross?discount/gross*100:0).toFixed(1)+'%'},
 {label:'Refunds',value:money(refund),change:comparison(refund,prior('refund')),tone:tone(refund,prior('refund'),true)},
 {label:'Total orders',value:String(visible.length),description:'Avg order '+money(visible.length?net/visible.length:0)},
 {label:'Customers',value:String(new Set(visible.map(row=>row.customer)).size),description:'Unique customers'}
 ].map(metric=>({span:2,tablet:3,html:B.metricCard({...metric,size:'compact',description:metric.description||'vs previous '+days+' days'})})),{span:8,html:C.section({title:'Revenue trend',description:'Gross and net revenue by day',chart:C.chart({type:'area',label:'Daily revenue trend',data:byDay,format:'currency',currency:'USD',height:280,series:[{key:'gross',label:'Gross revenue',color:'var(--color-type-tc)'},{key:'net',label:'Net revenue',color:'var(--color-brand)'}]}),variant:'bordered'})},{span:4,html:C.section({title:'By channel',description:'Net revenue contribution',chart:C.chart({type:'bar',barSize:'thin',label:'Net revenue by channel',data:breakdown,format:'currency',currency:'USD',height:280,series:[{key:'revenue',label:'Net revenue'}]}),variant:'bordered'})},{span:12,html:B.contentSection({title:'Revenue details',description:visible.length+' orders · '+period,content:U.table({label:'Revenue details',columns,rows:visible,minWidth:980,maxHeight:360}),footer:'<span class="sx-help">'+visible.length+' orders · Net revenue '+money(net)+'</span>',variant:'bordered'})}];document.getElementById('revenue-content').innerHTML=B.pageLayout(B.pageGrid(items),{variant:'data'})}
render();document.addEventListener('click',event=>{const option=event.target.closest('[data-select-value]');if(option){const root=option.closest('[data-select-demo]'),input=root.querySelector('input[type=hidden]');if(input.name==='revenue-period'||input.name==='revenue-channel')setTimeout(()=>{if(input.name==='revenue-period')period=input.value;else channel=input.value;render()},0)}const item=event.target.closest('[data-tree-key]');if(item?.dataset.treeKey==='overview')location.href='Dashboard%20overview.html';else if(item&&!['revenue','launch'].includes(item.dataset.treeKey)&&!item.hasAttribute('data-fold'))dsToast('Navigation example · '+item.textContent.trim())});
function exportRevenue(){const escape=value=>'"'+String(value).replaceAll('"','""')+'"',keys=['date','id','customer','channel','gross','discount','refund','net'],csv=[keys.join(','),...visible.map(row=>keys.map(key=>escape(row[key])).join(','))].join('\r\n'),url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='revenue-report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.addEventListener('click',async event=>{const item=event.target.closest('[data-menu-action^="report:"]');if(!item)return;event.stopImmediatePropagation();item.closest('[popover]').hidePopover();if(item.dataset.menuAction==='report:export'){exportRevenue();return}try{if(item.dataset.menuAction==='report:share'&&navigator.share)await navigator.share({title:'Revenue report',url:location.href});else{await navigator.clipboard.writeText(location.href);dsToast('Report link copied.','success')}}catch(error){if(error.name!=='AbortError')dsToast('Sharing is unavailable in this browser.','neutral')}},true);
document.addEventListener('click',event=>{if(event.target.closest('[data-tree-key="orders"]'))location.href='Orders.html'});document.addEventListener('click',e=>{if(e.target.closest('[data-tree-key="customers"]'))location.href='Customers.html'});</script></body></html>
