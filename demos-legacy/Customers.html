<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sesama · Customers</title><link rel="stylesheet" href="sesama-ui.css"><link rel="stylesheet" href="forms.css"><link rel="stylesheet" href="dashboard-components.css"><link rel="stylesheet" href="library.css"><script src="rune-icons.js"></script><script src="library.js"></script><script src="workspace-blocks.js"></script><script src="charts.js"></script><script src="forms.js" defer></script><script src="dashboard-components.js" defer></script><script src="primitives.js" defer></script><style>.orders-filters{justify-content:space-between}.orders-search{flex:0 1 260px;min-width:180px}.orders-filter-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-left:auto;min-width:0}@media(max-width:700px){.orders-search{flex:1 1 100%}.orders-filter-actions{width:100%}}.order-detail-content{display:grid;gap:24px}.order-section-inset{padding-inline:var(--space-16,16px)}.order-detail-content>.sb-content-section{gap:16px}.order-info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0;padding:0}.order-info-grid>div{min-width:0}.order-info-grid dt{color:var(--text-subtle);margin-bottom:4px}.order-info-grid dd{margin:0;overflow-wrap:anywhere}.order-detail-content thead th{height:28px;padding-top:0;padding-bottom:8px}.order-detail-content tfoot td{text-align:right;font-weight:400;border:0;height:32px;padding-block:6px}.order-detail-content tfoot tr:first-child td{border-top:1px solid var(--color-hairline);padding-top:8px;height:32px}.order-detail-content tfoot td:first-child{color:var(--text-subtle)}.order-detail-content tfoot .order-total td{font-weight:500;color:var(--text-default);height:32px}.order-detail-content .sx-table{table-layout:fixed}.order-detail-content .sx-table td{overflow-wrap:anywhere}@media(max-width:520px){.order-info-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}.customer-identity{display:flex;align-items:center;gap:8px}.customer-identity>div{min-width:0}.customer-identity span{font-size:12px;color:var(--text-subtle)}</style></head><body><div id="app"></div><script>
const U=SESAMA_UI,B=SESAMA_BLOCKS,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('en',{style:'currency',currency:'USD'}).format(n);
const names=['Amelia Park','Noah Ibarra','Priya Desai','Marcus Chen','Emily Johnson','Alex Morgan','Sofia Martinez','Oliver Wilson','Ava Thompson','Ethan Brooks','Isabella Rossi','Liam Anderson','Mia Robinson','Lucas Garcia','Charlotte Lee','James Taylor','Harper Davis','Benjamin Scott','Evelyn Moore','Henry Clark','Aria Patel','Leo Nguyen','Chloe Adams','Daniel Kim','Grace Turner','Samuel Reed','Lily Morgan','Jack Bennett','Ella Cooper','William Hayes','Zoe Mitchell','Mason Carter','Nora Evans','Sebastian Diaz','Lucy Collins','Owen Wright'];
const customers=names.map((name,i)=>({id:'CUS-'+(1001+i),name,email:name.toLowerCase().replace(' ','.')+'@'+['gmail.com','outlook.com','icloud.com'][i%3],orders:i%7===0?1:3+i%12,spent:Math.round((i%7===0?1:3+i%12)*(79+i*7.5)*100)/100,last:'2026-'+(i%5===0?'08':'10')+'-'+String(28-i%24).padStart(2,'0'),joined:'2026-'+String(1+i%9).padStart(2,'0')+'-12',status:i%5===0?'Inactive':i%7===0?'New':'Active',channel:['Website','Marketplace','Direct'][i%3],phone:'+1 (415) 555-'+String(1000+i)}));
let query='',statusFilter='All customers',channel='All channels',joined='Any time',page=1,size=15,sortKey='spent',direction='desc',filtered=[];
const tone=s=>U.statusDot(s==='Active'?'success':s==='New'?'informative':'neutral',s);
document.getElementById('app').innerHTML=B.appShell({sidebar:B.salesSidebar('customers'),header:B.pageHeader({title:'Customers',icon:'users'}),content:B.pageLayout('<div id="customer-toolbar"></div><div id="customer-results" style="margin-top:12px"></div>',{variant:'data'})});
const menu=U.menuPopup([{label:'Export CSV',icon:'file-down',action:'customers:export'},{label:'Copy link',icon:'copy',action:'customers:copy'},{label:'Share',icon:'share-2',action:'customers:share'}],'Customer actions');
document.getElementById('customer-toolbar').innerHTML=B.contentSection({title:'All customers',description:'Manage customer relationships and purchase history',content:`<div class="sb-section-filters orders-filters"><label class="field orders-search">${runeIcon('search',16)}<input id="customer-search" placeholder="Search name or email…" aria-label="Search customers"></label><div class="orders-filter-actions">${U.select('without label',{name:'customer-status',value:statusFilter,options:['All customers','Active','New','Inactive']})}${U.select('without label',{name:'customer-channel',value:channel,icon:'list-filter',options:['All channels','Website','Marketplace','Direct']})}${U.select('without label',{name:'customer-joined',value:joined,icon:'calendar',options:['Any time','Joined this quarter']})}${U.iconButton('kebab','outline size-base',`popovertarget="${menu.id}" aria-haspopup="menu"`,'Customer actions')}${menu.html}</div></div>`});
function render(){filtered=customers.filter(c=>(c.name+' '+c.email).toLowerCase().includes(query.toLowerCase())&&(statusFilter==='All customers'||c.status===statusFilter)&&(channel==='All channels'||c.channel===channel)&&(joined==='Any time'||c.joined>='2026-07-01'));filtered.sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return(typeof x==='number'?x-y:String(x).localeCompare(String(y),undefined,{numeric:true}))*(direction==='asc'?1:-1)});page=Math.min(page,Math.max(1,Math.ceil(filtered.length/size)));const columns=[{key:'name',header:'Customer',render:(_,c)=>`<div class="customer-identity">${U.avatar('default',24,{name:c.name,initials:c.name.split(' ').map(n=>n[0]).join(''),color:'auto'})}<div><div>${esc(c.name)}</div><span>${esc(c.email)}</span></div></div>`},{key:'orders',header:'Orders',align:'right'},{key:'spent',header:'Total spent',align:'right',render:money},{key:'last',header:'Last order'},{key:'joined',header:'Joined'},{key:'status',header:'Status',render:tone},{key:'actions',header:'Actions',align:'right',render:(_,c)=>`<div class="sx-table-actions">${U.iconButton('file-text','',`data-customer-details="${c.id}"`,'View '+c.name)}</div>`}];columns.forEach(c=>c.sortable=c.key!=='actions');document.getElementById('customer-results').innerHTML=B.dataSection({title:'',table:U.table({label:'Customers',rows:filtered.slice((page-1)*size,page*size),columns,minWidth:980,rowAction:'customer-details',sortKey,sortDirection:direction}),pagination:U.pagination(page,size,filtered.length)})}
function showCustomer(customer,trigger){const dialog=document.createElement('dialog');dialog.className='ds-modal';dialog.dataset.size='lg';dialog.setAttribute('aria-labelledby','customer-title');const fields=[['Email',esc(customer.email)],['Phone',customer.phone],['Joined',customer.joined],['Channel',customer.channel],['Status',tone(customer.status)]];const metrics=[['Orders',customer.orders],['Total spent',money(customer.spent)],['Avg. order value',money(customer.spent/customer.orders)]];const recent=Array.from({length:Math.min(4,customer.orders)},(_,i)=>({id:'ORD-'+(2101+(Number(customer.id.slice(4))-1001+i)%36),date:customer.last,total:Math.round(customer.spent/customer.orders*100)/100,status:i===0?'Processing':'Completed'}));const history=U.table({label:'Customer order history',columns:[{key:'id',header:'Order ID'},{key:'date',header:'Date'},{key:'total',header:'Total',align:'right',render:money},{key:'status',header:'Status',render:s=>U.statusDot(s==='Completed'?'success':'informative',s)}],rows:recent,rowAction:'customer-order'});dialog.innerHTML=`<div class="sx-modal-header"><h2 id="customer-title">${esc(customer.name)}</h2>${U.iconButton('x','sx-modal-close','data-modal-close','Close dialog')}</div><div class="sx-modal-body order-detail-content">${B.contentSection({title:'Customer Details',content:`<div class="order-section-inset"><dl class="order-info-grid">${fields.map(([label,value])=>`<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl></div>`})}${B.contentSection({title:'Purchase Overview',content:`<dl class="order-info-grid order-section-inset">${metrics.map(([label,value])=>`<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl>`})}${B.contentSection({title:'Recent Orders',content:history})}</div><div class="actions"><button class="btn secondary" data-modal-close>Close</button></div>`;document.body.append(dialog);dialog.addEventListener('close',()=>dialog.remove(),{once:true});dsOpenModal(dialog,trigger)}
render();document.addEventListener('input',e=>{if(e.target.id==='customer-search'){query=e.target.value;page=1;render()}});document.addEventListener('change',e=>{if(e.target.closest('#customer-results')&&e.target.matches('[data-page-size]')){size=Number(e.target.value);page=1;render()}});
document.addEventListener('click',e=>{const option=e.target.closest('[data-select-value]');if(option){const input=option.closest('[data-select-demo]')?.querySelector('input[type=hidden]');if(input?.name.startsWith('customer-'))setTimeout(()=>{if(input.name==='customer-status')statusFilter=input.value;if(input.name==='customer-channel')channel=input.value;if(input.name==='customer-joined')joined=input.value;page=1;render()},0)}const sort=e.target.closest('#customer-results [data-table-sort]');if(sort){direction=sortKey===sort.dataset.tableSort&&direction==='asc'?'desc':'asc';sortKey=sort.dataset.tableSort;page=1;render();document.querySelector('[data-table-sort="'+sortKey+'"]')?.focus({preventScroll:true})}const paging=e.target.closest('#customer-results [data-page-step],#customer-results [data-page-number]');if(paging){page=paging.hasAttribute('data-page-step')?page+Number(paging.dataset.pageStep):Number(paging.dataset.pageNumber);render()}const detail=e.target.closest('[data-customer-details]');if(detail)showCustomer(customers.find(c=>c.id===detail.dataset.customerDetails),detail);const key=e.target.closest('[data-tree-key]')?.dataset.treeKey;const routes={overview:'Dashboard overview.html',revenue:'Revenue report.html',orders:'Orders.html'};if(routes[key])location.href=routes[key]});
document.addEventListener('sesama:row-action',e=>{if(e.detail.action==='customer-details')showCustomer(customers.find(c=>c.id===e.detail.key),e.target);if(e.detail.action==='customer-order')location.href='Orders.html?order='+encodeURIComponent(e.detail.key)});
document.addEventListener('click',async e=>{const item=e.target.closest('[data-menu-action^="customers:"]');if(!item)return;e.stopImmediatePropagation();item.closest('[popover]').hidePopover();const action=item.dataset.menuAction;if(action==='customers:export'){const keys=['id','name','email','orders','spent','last','joined','status','channel'];const csv=[keys.join(','),...filtered.map(c=>keys.map(k=>'"'+String(c[k]).replaceAll('"','""')+'"').join(','))].join('\r\n'),url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='customers.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}try{if(action==='customers:share'&&navigator.share)await navigator.share({title:'Customers',url:location.href});else{await navigator.clipboard.writeText(location.href);dsToast('Link copied.','success')}}catch(error){if(error.name!=='AbortError')dsToast('Sharing is unavailable.')}},true);
</script></body></html>
