function outgoing(text,files=[]){document.querySelector('.agent-main').classList.remove('is-new-chat');document.getElementById('greeting').hidden=true;const node=make(get('Message','Sender / outgoing'));node.querySelector('[data-message-content]').textContent=text;node.querySelector('.sx-message-header')?.remove();if(files.length){const attachments=document.createElement('div');attachments.className='sx-message-attachment';for(const card of files){attachments.append(make(SESAMA_UI.fileAttachment({name:card.querySelector('.sx-file-open span').textContent,src:card.dataset.fileSrc,type:card.dataset.fileType,iconName:card.dataset.fileType==='image'?'file-image':'file'})))}node.querySelector('.bubble').append(attachments)}thread.append(node)}

const conversationSamples={"history-office": [["Help me prioritize the team workload this week.", "Start with work that unblocks others: confirm scope, assign milestone owners, and complete pending reviews. Reserve Friday for a progress review."], ["Can you break it down by day?", "Use Monday for planning, Tuesday and Wednesday for implementation, Thursday for review, and Friday for improvements."]], "history-coding": [["How should I connect an agent to our internal API?", "Use a server endpoint to validate requests and forward tasks to the agent service. Keep credentials on the server and return status updates to the UI."], ["What if processing takes a long time?", "Return a job ID and expose queued, running, completed, and failed states. Support cancellation and stream progress updates."]], "website-office": [["What should we check before launching the website?", "Review content, forms, analytics, metadata, and the main user journeys. Assign a monitoring owner and prepare a rollback procedure."], ["What order should we use?", "Test core journeys first, followed by mobile layouts, accessibility, performance, and SEO. Verify the domain and monitoring last."]], "website-coding": [["The landing page overflows on mobile.", "Check fixed-width elements and flex children missing min-width: 0. Images should fit their containers and grid columns must be allowed to shrink."], ["How can I locate the source?", "Compare scrollWidth and clientWidth in DevTools, starting with the overflowing section and inspecting its children."]], "website-design": [["Suggest a homepage structure for our collaboration product.", "Start with a clear benefit and a product preview, then show practical workflows and customer evidence. Finish with a focused call to action."], ["Should the preview be interactive?", "Use a clear image first. An interactive demo works better once visitors understand the context and want to explore the workflow."]], "tools-office": [["Summarize what operations needs in an internal dashboard.", "The team needs pending work, request status, search, and recent activity. Every item should have an owner and a clear next action."], ["What belongs in the first version?", "Prioritize the request list, status filters, item details, and status updates. Add advanced analytics after the main workflow is stable."]], "tools-coding": [["Help me add status filters to a table.", "Apply the filter before pagination and reset the page when it changes. Keep selection tied to row identity."], ["What happens when there are no results?", "Show an Empty State explaining the active filter and offer a clear-filters action. Keep the table header and filters visible."]], "tools-design": [["Help me simplify this dashboard.", "Separate summaries from the main work list, reduce unnecessary borders, standardize row heights, and clarify the hierarchy of titles, metadata, and actions."], ["How should we use color?", "Use neutrals for structure, brand blue for primary actions and selection, and semantic colors only when they communicate status."]], "history-design": [["Review our design system for a team collaboration product.", "Start with the core workflows: project navigation, reading conversations, composing messages, and attaching documents. Consistency across these journeys matters more than the number of variants."], ["How do we review input consistency?", "Compare control height, padding, labels, placeholders, hover, and focus. Input, Select, and Date Picker should use shared spacing tokens. Helper text is optional and should add useful context."], ["What about navigation?", "Use indentation to express hierarchy. Parent items can have chevrons; children do not need extra icons when labels are clear. Selection should be visible without dominating the page."], ["How should long conversation titles behave?", "Truncate them with ellipsis within their container. Reserve space for actions and provide the full title through an accessible name or tooltip."], ["Let us review the Composer.", "The text area starts at two lines and grows with the content. Use the shared attachment menu, context and model Selects, microphone button, and Send control. Send becomes Stop while the agent is working."], ["How should attachments appear?", "Use a compact grid inside the Composer. After sending, show File Cards inside the message. Clicking a filename expands its preview; unsupported formats use a fallback icon."], ["What makes long responses readable?", "Use 14px text with a 22px line height and a constrained reading width. Keep paragraph spacing consistent and use icon actions with brief click feedback."], ["What should we test while scrolling?", "Keep the header and Composer accessible. Ensure the final message is not obscured and tooltips dismiss on scroll. Edge fades should indicate content beyond the viewport."], ["What if someone is reading older messages?", "Preserve their reading position rather than forcing them to the bottom. Scroll to a newly submitted message when they send it themselves. Opening menus should not move the conversation."], ["How do we keep the demo consistent?", "Define typography, controls, colors, internal spacing, and states in shared components. The demo should own page layout, sample data, and application interactions."], ["Summarize the next steps.", "Test the core journeys on desktop and mobile. Check keyboard navigation, focus, contrast, and reduced motion. Update component documentation before connecting model and tool APIs."]]};

 {n:'Sesama workspace',i:'folder',key:'project-sesama',k:[{n:'Plan team priorities this week',i:false,key:'history-office'},{n:'Connect the agent to our API',i:false,key:'history-coding'},{n:'Review the design system · long conversation',i:false,key:'history-design'}]},
 {n:'Website launch',i:'folder',key:'project-website',o:0,k:[{n:'Prepare the launch checklist',i:false,key:'website-office'},{n:'Fix the landing page layout',i:false,key:'website-coding'},{n:'Explore homepage ideas',i:false,key:'website-design'}]},
 {n:'Internal tools',i:'folder',key:'project-tools',o:0,k:[{n:'Summarize operations requirements',i:false,key:'tools-office'},{n:'Add table filters',i:false,key:'tools-coding'},{n:'Simplify the dashboard',i:false,key:'tools-design'}]}
]);history.addEventListener('click',event=>{const item=event.target.closest('[data-tree-key]');if(!item||item.hasAttribute('data-fold'))return;openConversation(item.dataset.treeKey,item.textContent.trim())});

document.getElementById('project-section').insertAdjacentHTML('afterbegin',SESAMA_UI.iconButton('kebab','project-rail-button','aria-label="Projects"','Projects'));document.querySelector('.project-rail-button').onclick=()=>{sidebarApp.classList.remove('sidebar-collapsed');document.getElementById('toggle-sidebar').setAttribute('aria-expanded','true')};
document.getElementById('add-project').onclick=event=>{const trigger=event.currentTarget,dialog=document.createElement('dialog');dialog.className='ds-modal';dialog.setAttribute('aria-labelledby','add-project-title');dialog.innerHTML='<div class="sx-modal-header"><h2 id="add-project-title">New project</h2>'+SESAMA_UI.iconButton('x','sx-modal-close','data-modal-close','Close dialog')+'</div><form><div class="form-field"><label class="form-label" for="project-name">Project name</label><div class="field"><input id="project-name" placeholder="Project name" required></div></div><div class="actions"><button type="button" class="btn secondary" data-modal-close>Cancel</button><button class="btn primary" type="submit">Create project</button></div></form>';document.body.append(dialog);dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const name=dialog.querySelector('input').value.trim();if(!name)return;history.insertAdjacentHTML('beforeend',SESAMA_UI.tree([{n:name,i:'folder',key:'project-'+Date.now(),k:[]}]));dialog.close();dsToast('Project created.','success')};dialog.addEventListener('close',()=>dialog.remove(),{once:true});dsOpenModal(dialog,trigger)};
document.getElementById('new-chat').onclick=()=>{clearTimeout(pending);thinkingNode?.remove();if(activeConversation)conversationViews.set(activeConversation,[...thread.childNodes]);activeConversation=null;thread.replaceChildren();document.getElementById('agent-name').textContent='New chat';document.querySelector('.agent-main').classList.add('is-new-chat');document.getElementById('greeting').hidden=false;composer.querySelector('textarea').value='';composer.querySelector('textarea').style.height='auto';resetSend();composer.querySelector('textarea').focus()};const detail=document.getElementById('detail');const detailTrigger=document.getElementById('run-detail');if(detailTrigger)detailTrigger.onclick=()=>{detail.hidden=!detail.hidden;document.querySelector('.agent-app').classList.toggle('has-details',!detail.hidden);document.getElementById('run-detail')?.setAttribute('aria-expanded',String(!detail.hidden))};document.getElementById('close-detail').onclick=()=>{detail.hidden=true;document.querySelector('.agent-app').classList.remove('has-details');document.getElementById('run-detail')?.setAttribute('aria-expanded','false')};</script></body></html>
