<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sesama Workspace Starter</title>
  <link rel="stylesheet" href="src/styles/fonts.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/blocks.css">
</head>
<body class="sui-root">
  <div id="app"></div>
  <script type="module">
    import {
      appShell,
      workspaceSidebar,
      pageHeader,
      pageLayout,
      pageGrid,
      dataSection,
      table,
      button,
      statusDot,
      mount
    } from './src/index.mjs';

    const projectTable = table({
      columns: [
        { key: 'name', label: 'Initiative', sortable: true },
        { key: 'lead', label: 'Lead' },
        { key: 'status', label: 'Status' }
      ],
      rows: [
        {
          id: 'proj-1',
          name: 'Sesama UI Component API',
          lead: 'Core Engineering',
          status: statusDot({ status: 'success', label: 'Active' })
        },
        {
          id: 'proj-2',
          name: 'Documentation & Starter Skill',
          lead: 'Design Systems',
          status: statusDot({ status: 'neutral', label: 'Complete' })
        }
      ]
    });

    const pageContent = dataSection({
      title: 'Current Projects',
      description: 'Active workspaces and strategic initiatives',
      actions: button({ label: 'New Initiative', variant: 'primary', icon: 'plus' }),
      table: projectTable
    });

    const app = document.getElementById('app');
    app.innerHTML = appShell({
      sidebar: workspaceSidebar({
        brand: { name: 'Sesama Workspace', badge: 'v2.0' },
        navigation: [
          { id: 'overview', label: 'Overview', icon: 'folder', active: true },
          { id: 'reports', label: 'Reports', icon: 'file-text' }
        ],
        projects: [
          {
            id: 'grp-initiatives',
            label: 'Initiatives',
            items: [
              { id: 'proj-1', label: 'Component API', active: true },
              { id: 'proj-2', label: 'Documentation' }
            ]
          }
        ]
      }),
      header: pageHeader({
        title: 'Overview & Reports',
        icon: 'folder'
      }),
      content: pageLayout(
        pageGrid([{ html: pageContent, span: 12 }]),
        { variant: 'data' }
      )
    });

    // Hydrate all controllers in the document
    mount(document.body);
  </script>
</body>
</html>
