<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Requirements dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@420;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark}
:root[data-mode="light"]{color-scheme:light}
:root[data-mode="dark"]{color-scheme:dark}
:root{
--color-canvas:light-dark(#f6f6f3,#141413);--color-base:light-dark(#fdfdfb,#1d1d1b);--color-recessed:light-dark(#efefeb,#262624);
--color-tint:light-dark(rgba(33,33,31,.05),rgba(255,255,255,.06));--color-fill:light-dark(#dfe1ea,#2e2e2c);--color-contrast:light-dark(#21211f,#f4f4f1);
--text-default:light-dark(rgba(1,1,1,.81),rgba(255,255,255,.88));--text-subtle:light-dark(rgba(3,3,2,.62),rgba(255,255,255,.62));--text-placeholder:light-dark(rgba(6,6,6,.43),rgba(255,255,255,.4));
--text-on-brand:#fff;--text-inverse:light-dark(#fff,#141413);
--color-hairline:light-dark(rgba(0,0,0,.08),rgba(255,255,255,.09));--color-edge:light-dark(rgba(0,0,0,.08),rgba(255,255,255,.1));

--color-brand:#1f3acb;--color-brand-hover:#395fe5;--color-brand-tint:light-dark(rgba(0,70,255,.04),rgba(80,120,255,.07));--color-brand-line:light-dark(#b5cbfd,#2f4590);
--color-success:light-dark(#0f9912,#4cc455);--color-danger:light-dark(#d03a2f,#f06a5f);--color-neutral:light-dark(#c8c7c3,#4a4a47);
--color-type-sys:light-dark(#dd6d03,#f59a3d);--color-type-req:light-dark(#1f3acb,#8fa6ff);--color-type-fn:light-dark(#7c1789,#d58be0);--color-type-tc:light-dark(#1ea4bd,#5fd0e6);
--shadow-ring:0 0 0 1px var(--color-edge),0 0 4px var(--color-drop),0 2px 4px var(--color-drop),inset 0 1px 0 var(--color-shine);
--shadow-float:var(--shadow-ring),0 8px 24px var(--color-drop-lg);

--space-2:2px;--space-4:4px;--space-6:6px;--space-8:8px;--space-12:12px;--space-16:16px;--space-24:24px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--color-canvas);color:var(--text-default);font:420 12px/16px "Inter",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
svg{display:block;flex:none}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--color-brand-hover);outline-offset:2px}
.sys{--c:var(--color-type-sys)}.req{--c:var(--color-type-req)}.fn{--c:var(--color-type-fn)}.tc{--c:var(--color-type-tc)}
.c{display:flex;color:var(--c,currentColor)}
/* shell */
.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
@media(max-width:800px){.shell{grid-template-columns:1fr}.nav{position:static!important;height:auto!important;flex-direction:row!important;overflow-x:auto}.nav h1,.nav .grow{display:none}}
.nav{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:20px 12px;border-right:1px solid var(--color-hairline)}
.nav h1{margin:0 0 12px 8px;font-size:14px;line-height:20px;font-weight:500}
.nav button{display:flex;justify-content:space-between;gap:12px;padding:6px 8px;border-radius:var(--radius-md);color:var(--text-subtle);white-space:nowrap}
.nav button:hover{background:var(--color-tint)}.nav button[aria-current=true]{background:var(--color-tint);color:var(--text-default);font-weight:500}
.nav small{font-size:11px;color:var(--text-placeholder)}.grow{flex:1}
main{padding:28px clamp(16px,4vw,48px) 64px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.top h2{margin:0;font-size:18px;line-height:24px;font-weight:500}.top p{margin:2px 0 0;color:var(--text-subtle);max-width:56ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.item{min-width:0;display:flex;flex-direction:column;border-radius:var(--radius-lg);background:var(--color-base);box-shadow:var(--shadow-ring);overflow:hidden}
.stage{display:grid;place-items:center;min-height:170px;padding:24px;overflow:auto;background-image:radial-gradient(circle at 9.8px 8.7px,var(--color-hairline) 1.2px,transparent 1.3px);background-size:19.55px 17.35px;border-bottom:1px solid var(--color-hairline)}
.im{padding:12px}.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}.mh b{font-size:13px;line-height:20px;font-weight:500}
.im p{margin:2px 0 0;font-size:11px;line-height:15px;color:var(--text-subtle)}.im em{font-style:normal;color:var(--text-placeholder);margin-right:6px}
.hint{font-size:11px;line-height:15px;color:var(--text-placeholder)}.row{display:flex;gap:var(--space-8);align-items:center;flex-wrap:wrap;justify-content:center}.mr{display:inline-flex;align-items:center;gap:var(--space-8)}
.hr{height:1px;background:var(--color-hairline);margin:var(--space-4) 0}.empty{grid-column:1/-1;padding:48px;text-align:center;color:var(--text-subtle)}
/* atoms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-4);min-height:24px;padding:var(--space-4) var(--space-6);border-radius:var(--radius-sm);font-weight:500;white-space:nowrap}
.btn.primary{background:var(--color-brand);color:var(--text-on-brand);box-shadow:0 0 0 1px color-mix(in srgb,var(--color-brand) 78%,#000),inset 0 1px .5px var(--color-brand-hover)}.btn.primary:hover{background:var(--color-brand-hover)}
.btn.secondary{background:var(--color-base);box-shadow:var(--shadow-ring)}.btn.secondary:hover,.select:hover{background:var(--color-recessed)}
.btn.ghost{color:var(--text-subtle)}.btn.ghost:hover,.ti:hover,.ibtn:hover,.chip:hover{background:var(--color-tint)}
.btn.dashed{padding:3px 5px;border:1px dashed var(--text-placeholder);color:var(--text-subtle)}.btn.dashed:hover{background:var(--color-tint)}
.btn .sep{align-self:stretch;width:1px;margin:0 var(--space-4);background:currentColor;opacity:.25}
.btn:active,.ibtn:active{transform:translateY(1px)}
.ibtn{display:grid;place-items:center;width:24px;height:24px;border-radius:var(--radius-sm);color:var(--text-placeholder)}.ibtn:hover{color:var(--text-default)}
.ibtn.raised{background:var(--color-base);box-shadow:var(--shadow-ring)}.ibtn.on{color:var(--color-brand-hover);box-shadow:0 0 0 1px var(--color-brand-hover)}
.badge{display:inline-flex;align-items:center;height:16px;padding:0 var(--space-6);border-radius:var(--radius-xs);background:var(--color-tint);font-size:11px;font-weight:500;color:var(--text-subtle)}
.badge.req,.badge.tc,.tint{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.av{display:grid;place-items:center;flex:none;width:16px;height:16px;border-radius:50%;font-size:8px;line-height:12px;font-weight:500}
.av.l{width:24px;height:24px;font-size:10px}.av[data-sel]{cursor:pointer}.av.on{box-shadow:0 0 0 2px var(--color-base),0 0 0 4px var(--color-brand-hover)}
.dot{width:8px;height:8px;background:var(--color-neutral)}.dot.ok,.lrow:not(.off) .dot{background:var(--color-success)}
.st{display:inline-flex;align-items:center;gap:var(--space-8);color:var(--text-subtle)}
.sw{display:flex;width:32px;height:18px;padding:2px;border-radius:var(--radius-sm);background:var(--color-neutral)}.sw i{width:14px;height:14px;border-radius:var(--radius-xs);background:var(--text-on-brand);box-shadow:0 1px 2px var(--color-drop)}
.sw[aria-checked=true]{background:var(--color-brand);justify-content:flex-end}
.field{display:flex;align-items:center;gap:var(--space-8);width:220px;min-height:28px;padding:var(--space-4) var(--space-8);border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--color-hairline);color:var(--text-placeholder)}
.field:focus-within{box-shadow:inset 0 0 0 1px var(--color-brand-hover)}.field input{all:unset;flex:1;min-width:0;color:var(--text-default)}.field input::placeholder{color:var(--text-placeholder)}
.chip{display:inline-flex;align-items:center;gap:var(--space-6);height:24px;padding:0 var(--space-8);border-radius:var(--radius-sm);background:var(--color-recessed);font-weight:500;white-space:nowrap}
.tl{display:inline-flex;align-items:center;gap:var(--space-6);font-size:11px;line-height:15px;font-weight:500;color:var(--c)}
.cv{display:flex;transition:transform .12s}[aria-expanded=false] .cv{transform:rotate(-90deg)}
.wires{overflow:visible}.wires rect{fill:var(--color-base);stroke:var(--color-hairline)}.wires path{stroke:var(--text-placeholder);stroke-width:1}.wires circle{fill:var(--color-base);stroke:var(--text-placeholder)}
/* molecules */
.select{display:flex;align-items:center;gap:var(--space-8);min-height:28px;padding:var(--space-4) var(--space-8);border-radius:var(--radius-sm);background:var(--color-base);box-shadow:var(--shadow-ring);font-weight:500}
.select .lbl{flex:1;white-space:nowrap}.select.inline{background:none;box-shadow:none}.select.inline:hover{background:var(--color-tint)}.select[aria-expanded=true]{box-shadow:0 0 0 1.5px var(--color-brand-hover)}
.seg{display:flex;gap:2px;padding:2px;width:200px;border-radius:var(--radius-md);background:var(--color-recessed)}.seg button{flex:1;text-align:center;padding:var(--space-4) var(--space-6);border-radius:var(--radius-sm);font-weight:500;color:var(--text-placeholder)}
.seg .on{background:var(--color-base);color:var(--text-default);box-shadow:var(--shadow-ring)}.pill{display:flex;gap:var(--space-4)}.pill button{padding:var(--space-4) var(--space-8);border-radius:var(--radius-sm);font-weight:500;color:var(--text-placeholder)}.pill .on{background:var(--color-recessed);color:var(--text-default)}
.seg button:not(.on):hover,.pill button:not(.on):hover{color:var(--text-default)}
.ti{display:flex;align-items:center;gap:var(--space-8);width:100%;padding:var(--space-6) var(--space-8);border-radius:var(--radius-md);font-weight:500}.ti.on{background:var(--color-tint)}.ti .sp{width:12px}.ti .c{color:var(--c,var(--text-placeholder))}
.br{display:flex;padding-left:var(--space-8)}.br>i{display:flex;justify-content:center;width:14px}.br>i::before{content:"";width:1px;background:var(--color-hairline)}.br>div{flex:1;min-width:0}
.slist{display:grid;gap:var(--space-8);width:100%;max-width:340px;padding:var(--space-12);border-radius:var(--radius-xl);background:var(--color-recessed)}.slist.plain{padding:0;background:none}
.slh{display:flex;justify-content:space-between;padding:0 var(--space-4);color:var(--text-subtle)}
.lrow{display:flex;align-items:center;gap:var(--space-12);min-height:40px;padding:var(--space-8) var(--space-12);border-radius:var(--radius-md);background:var(--color-base);box-shadow:var(--shadow-ring)}.lrow.off{opacity:.78}.lrow .nm{flex:1;font-weight:500;white-space:nowrap}
.card{position:relative;width:100%;border-radius:var(--radius-md);background:var(--color-base);box-shadow:var(--shadow-ring)}.card:hover{box-shadow:var(--shadow-float)}.card.on{box-shadow:0 0 0 1.5px var(--color-brand-hover)}
.ch{display:flex;align-items:center;justify-content:space-between;padding:var(--space-8) var(--space-12)}.cb{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-8);padding:0 var(--space-12) var(--space-12)}.card.bare .cb{padding-top:var(--space-12)}
.cb b{font-size:13px;line-height:20px;font-weight:500}.cm{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--text-subtle)}
.node{min-width:0}.node>.tl{margin:0 0 var(--space-6) var(--space-4)}.card .nopen{position:absolute;right:-12px;top:50%;margin-top:-12px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,150px));gap:var(--space-16) 28px}
.bubble{max-width:260px;padding:var(--space-8) var(--space-12);border-radius:var(--radius-lg);background:var(--color-recessed)}
.steps{display:grid;gap:var(--space-6);margin:var(--space-6) 0 0;padding:0 0 0 var(--space-8);list-style:none;color:var(--text-subtle)}.steps li{display:flex;align-items:center;gap:var(--space-8)}
.fcard{width:250px;overflow:hidden;border-radius:var(--radius-md);background:var(--color-base);box-shadow:var(--shadow-ring)}.fhead{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-4) var(--space-6) var(--space-4) var(--space-12);color:var(--text-subtle)}
.fhead span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fprev{display:grid;place-items:center;padding:var(--space-12);border-top:1px solid var(--color-hairline)}
.composer{width:260px;padding:var(--space-8) var(--space-12);border-radius:var(--radius-lg);background:var(--color-base);box-shadow:var(--shadow-ring)}.composer:focus-within{box-shadow:0 0 0 1.5px var(--color-brand-hover)}
.composer textarea{all:unset;display:block;box-sizing:border-box;width:100%;min-height:36px;white-space:pre-wrap;word-break:break-word;color:var(--text-default)}.composer textarea::placeholder{color:var(--text-placeholder)}
.cbar{display:flex;align-items:center;gap:var(--space-8);margin-top:var(--space-6)}
.send{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--color-recessed);color:var(--text-placeholder)}.send:not(:disabled){background:var(--color-brand);color:var(--text-on-brand)}.send:disabled{cursor:default}
/* organisms */
.sbar{display:grid;gap:var(--space-4);width:240px;padding:var(--space-8);border-radius:var(--radius-md);background:var(--color-recessed)}.shead{display:flex;align-items:center;justify-content:space-between}
.glabel{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-6)}.group{display:grid;gap:var(--space-8);padding:var(--space-16);border-radius:var(--radius-md);border:1px solid var(--color-brand-line);background:var(--color-brand-tint)}
.agent{display:grid;gap:var(--space-8);width:100%;max-width:340px;padding:var(--space-24);border-radius:var(--radius-xl);background:var(--color-base);box-shadow:var(--shadow-dialog)}
.agent b{margin-top:var(--space-12);font-size:14px;line-height:20px;font-weight:500}.agent p{margin:0;color:var(--text-subtle)}.cap{margin-top:var(--space-12);color:var(--text-placeholder)}.foot{display:flex;justify-content:flex-end;gap:var(--space-8);margin-top:var(--space-12)}
.d1{fill:var(--color-brand)}.d0{fill:var(--color-fill)}
.dlg{width:100%;max-width:400px;padding:var(--space-8);border-radius:var(--radius-xl);background:var(--color-recessed);box-shadow:var(--shadow-dialog)}
.dh{display:flex;align-items:center;gap:var(--space-12);padding:var(--space-6) var(--space-8)}.dh b{flex:1;font-size:16px;line-height:24px;font-weight:500}.dh>svg{color:var(--color-brand)}
.dbody{margin-top:var(--space-8);border-radius:var(--radius-md);background:var(--color-base);box-shadow:var(--shadow-ring)}.dbody:focus-within{box-shadow:0 0 0 1.5px var(--color-brand-hover)}
.dbody textarea{all:unset;display:block;box-sizing:border-box;width:100%;min-height:170px;padding:var(--space-16);line-height:20px;white-space:pre-wrap;color:var(--text-default)}
.df{display:flex;justify-content:flex-end;gap:var(--space-8);padding:var(--space-12) var(--space-6) var(--space-6)}
table{border-collapse:collapse;width:100%;max-width:300px}th,td{padding:var(--space-6) var(--space-8);text-align:left;border-bottom:1px solid var(--color-hairline)}th{color:var(--text-placeholder);font-weight:500}td:first-child{font-weight:500}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.on{background:var(--color-tint)}
/* foundations */
.swgrid{display:grid;grid-template-columns:repeat(3,72px);gap:var(--space-12)}.swc{display:grid;gap:var(--space-6);font-size:11px;color:var(--text-subtle)}.swc i{height:32px;border-radius:var(--radius-sm);box-shadow:var(--shadow-ring)}
.spr{display:flex;align-items:center;gap:var(--space-12);font-size:11px;color:var(--text-subtle)}.spr i{height:8px;border-radius:var(--radius-xs);background:var(--color-brand)}
.rd,.el{display:grid;gap:var(--space-6);justify-items:center;font-size:11px;color:var(--text-subtle)}.rd i,.el i{width:44px;height:44px;background:var(--color-base);box-shadow:var(--shadow-ring)}
.pop{position:fixed;z-index:20;padding:var(--space-4);border-radius:var(--radius-md);background:var(--color-base);box-shadow:var(--shadow-float)}
.pop button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:var(--space-6) var(--space-8);border-radius:var(--radius-sm);font-weight:500}
.pop button:hover,.pop button:focus-visible{background:var(--color-tint);outline:0}.pop [aria-checked=true]::after{content:"\2713";color:var(--color-brand-hover)}

#toast.show{opacity:1;transform:translate(-50%,0)}

[hidden]{display:none!important}
.btn.xs{min-height:20px;padding:var(--space-2) var(--space-4)}.btn.base{min-height:28px;padding:var(--space-4) var(--space-8)}.btn.lg{min-height:32px;padding:var(--space-6) var(--space-12)}

.doc{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--space-16)}

.canvas{flex:1;min-width:0;overflow:auto;background-image:radial-gradient(circle at 9.8px 8.7px,var(--color-hairline) 1.2px,transparent 1.3px);background-size:19.55px 17.35px}
.scroll{flex:1;min-width:0;overflow:auto}
.wrap{position:relative}.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world .wires{position:absolute;left:0;top:0}
.dn{position:absolute;width:190px}.dn .card{height:50px;display:flex;align-items:center;cursor:pointer}
.dn .cb{flex-direction:row;align-items:center;justify-content:space-between;width:100%;height:100%;padding:0 var(--space-12);gap:var(--space-6)}
.dn .cb b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nopen.flip svg{transform:scaleX(-1)}
.zbar{position:absolute;top:var(--space-8);right:var(--space-12);display:grid;gap:var(--space-6);justify-items:center}
.tbl{max-width:none;width:100%}.tbl th,.tbl td{padding:var(--space-8) var(--space-12)}
.reader{max-width:640px;margin:0 auto;padding:var(--space-24)}.rline{display:flex;align-items:center;gap:var(--space-8);padding-top:var(--space-6);padding-bottom:var(--space-6);cursor:pointer}.rline b{font-size:13px;line-height:20px;font-weight:500}
.nm1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab{display:flex;flex-direction:column;flex:1;min-height:0}
.apanel .shead{padding:var(--space-8) var(--space-12)}
.msgs{flex:1;overflow:auto;display:grid;gap:var(--space-8);align-content:start;padding:var(--space-4) var(--space-12) var(--space-12)}
.msgs h4{margin:var(--space-8) 0 0;font-size:13px;line-height:18px;font-weight:500}.msgs p{margin:0;color:var(--text-subtle)}
.apanel .bubble{max-width:100%}.bubble.me{justify-self:end;max-width:92%}.bubble.bot{background:none;box-shadow:inset 0 0 0 1px var(--color-hairline)}
.aff{display:grid;gap:var(--space-6);justify-items:start}
.steps{opacity:.6}.steps.done{opacity:1;color:var(--text-default)}
.apanel .fcard{width:100%}.cmp{display:grid;gap:var(--space-6);padding:var(--space-8) var(--space-12) var(--space-12)}.apanel .composer{width:100%}
@media(max-width:900px){.app{grid-template-columns:1fr}.side,.apanel{position:fixed;top:0;bottom:0;z-index:15;padding:var(--space-8);background:var(--color-canvas);box-shadow:var(--shadow-dialog)}.side{left:0}.apanel{right:0;width:min(340px,100vw);border-radius:0}}

</style>
<script src="rune-icons.js"></script>
</head>
<body>
<div class="app" id="app"><aside class="side" id="side"></aside><main class="pnl" id="main"></main><aside class="pnl apanel" id="apanel"></aside></div>
<div id="pop" class="pop" role="menu" hidden></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const ic=runeIcon;
const cv=(s=12)=>`<span class="cv">${ic('chev',s)}</span>`;
const LBL={sys:'System',req:'Requirement',fn:'Functions',tc:'Test Case'},OW={W:'fn',N:'tc',J:'req'};
/* atoms */
const btn=(l,v='secondary',i='',a='')=>`<button class="btn ${v}" ${a}>${i?ic(i):''}${l}</button>`;
const ibtn=(i,v='',a='',t=i)=>`<button class="ibtn ${v}" aria-label="${t}" ${a}>${ic(i)}</button>`;
const av=(o,l,a='')=>`<span class="av tint ${OW[o]}${l?' l':''}" ${a}>${o}</span>`;
const sw=on=>`<button class="sw" role="switch" aria-checked="${!!on}" data-switch aria-label="Toggle skill"><i></i></button>`;
const tl=t=>`<span class="tl ${t}">${ic(t,13)}${LBL[t]}</span>`;
const chip=(i,l)=>`<button class="chip ${i==='req'?'req':''}" data-toast="Opened ${l}"><span class="c">${ic(i,13)}</span>${l}</button>`;
const badge=(l,t='')=>`<span class="badge ${t}">${l}</span>`;
/* molecules */
const sel=(l,items,i='',v='',w=240)=>`<button class="select ${v}" style="width:${w}px" data-menu="${items}" data-pick>${i?ic(i):''}<span class="lbl">${l}</span>${cv()}</button>`;
const seg=(items,on,v)=>`<div class="${v}" data-seg role="tablist">${items.map(x=>`<button role="tab" class="${x===on?'on':''}">${x}</button>`).join('')}</div>`;
const tree=ns=>ns.map(n=>`<button class="ti" data-sel${n.k?` data-fold aria-expanded="${n.o!==0}"`:''}>${n.k?cv():'<i class="sp"></i>'}<span class="c ${n.t||''}">${ic(n.i)}</span>${n.n}</button>${n.k?`<div class="br" data-branch${n.o===0?' hidden':''}><i></i><div>${tree(n.k)}</div></div>`:''}`).join('');
const row=(n,on,s)=>`<div class="lrow${on?'':' off'}">${ic('skill',16)}<span class="nm">${n}</span><span class="st"><i class="dot"></i><span class="st-t">${on?'Enabled':'Disabled'}</span></span>${s?sw(on):''}${ibtn('kebab','','data-menu="Edit,Duplicate,Delete" data-verb="Selected"','Row actions')}</div>`;
const card=(t,n,o={})=>{
 const m=`<span class="mr">${o.c?`<span class="cm">${ic('chat',12)}${o.c}</span>`:''}${o.w?av(o.w):''}</span>`;
 const b=`<div class="cb"><b>${n}</b>${o.d?badge('Draft'):''}</div>${o.h?ibtn('chevR','raised nopen',`data-toast="Expanded ${n}"`,'Expand'):''}`;
 return o.bare?`<div class="node ${t}"><div class="tl">${ic(t,13)}${LBL[t]}</div><div class="card bare${o.on?' on':''}" data-i data-sel>${b}</div></div>`
 :`<div class="card${o.on?' on':''}" data-i data-sel><div class="ch">${tl(t)}${m}</div>${b}</div>`};
const DOTS=[...'0000001010011101111111111'].map((v,k)=>`<circle class="d${v}" cx="${2.4+4.8*(k%5)}" cy="${2.4+4.8*Math.floor(k/5)}" r="2.05"/>`).join('');
const swc=(n,v)=>`<button class="swc" data-toast="${v}"><i style="background:var(${v})"></i>${n}</button>`;
const TREE=[{n:'Vehicle',i:'sys',t:'sys',k:[{n:'Chassis',i:'sys',t:'sys'},{n:'Powertrain',i:'sys',t:'sys',k:[{n:'Peak Wheel Power',i:'req',t:'req'},{n:'Mass of Powertrain',i:'req',t:'req'}]}]}];
const MD='# Systems Engineering Skill\n\nYou are an experienced systems engineer focused on reliability, scalability, security, and operational excellence.\n\n## Core Principles\n\n* Prefer simple architectures over complex ones.\n* Design for failure; assume components will eventually break.\n* Automate repetitive operations.';

/* behaviour */
let tt,popFor=null;const toast=document.getElementById('toast'),pop=document.getElementById('pop');
const say=m=>{toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1800)};
const closePop=back=>{pop.hidden=true;if(popFor){popFor.removeAttribute('aria-expanded');if(back)popFor.focus()}popFor=null};
function openMenu(el){
 const items=el.dataset.menu.split(','),pick='pick' in el.dataset,cur=pick?el.querySelector('.lbl').textContent:'';
 pop.innerHTML=items.map(t=>`<button role="${pick?'menuitemradio':'menuitem'}" ${pick?`aria-checked="${t===cur}"`:''}>${t}</button>`).join('');
 pop.hidden=false;popFor=el;el.setAttribute('aria-expanded','true');
 const r=el.getBoundingClientRect();pop.style.minWidth=Math.max(160,r.width)+'px';
 pop.style.left=Math.max(8,Math.min(r.left,innerWidth-pop.offsetWidth-8))+'px';
 pop.style.top=(r.bottom+pop.offsetHeight+14>innerHeight?r.top-pop.offsetHeight-6:r.bottom+6)+'px';
 pop.querySelector('button').focus();
}

/* dashboard */
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N={};
const T=(id,type,name,o={},kids=[])=>{N[id]={id,type,name,w:o.w||'N',draft:!!o.d,kids};kids.forEach(k=>N[k].parent=id)};
T('tc1','tc','Peak Power Run');T('tc2','tc','Torque\u2013Speed Sweep');T('tc3','tc','Peak Power Run');
T('wheel','req','Peak Wheel Power',{w:'J'},['tc1']);T('shaft','req','Peak Motor Shaft Power',{w:'W'},['tc3']);
T('mass','req','Mass of Powertrain',{w:'W',d:1});T('launch','fn','Launch Modes',{w:'W'},['tc2']);
T('phase','req','Peak Phase Current',{w:'N'});T('hold','req','Peak Torque Hold Duration',{w:'J'});
T('pt','sys','Powertrain',{w:'W'},['wheel','shaft','mass','launch','phase','hold']);
T('chassis','sys','Chassis');T('interior','sys','Interior');T('vmass','req','Vehicle Mass',{w:'J'});T('range','req','Range');T('speed','req','Top Speed');
T('veh','sys','Vehicle',{},['chassis','interior','vmass','range','speed','pt']);
const CW=190,CH=50,LH=21,PITCH=86,COLW=252,PAD=40,NT={Requirement:'req',Functions:'fn','Test Case':'tc',System:'sys'};
let root='pt',cur='wheel',z=1,mode='tree',sq='',applied=false,seq=1,dim={W:1,H:1};
const opn=new Set(['wheel','shaft','launch']),sopen=new Set(['veh','pt']),upd=new Set();
const vis=(id,d)=>d===0||opn.has(id)?N[id].kids:[];
const bdg=n=>upd.has(n.id)?'<span class="badge tc">Updated</span>':n.draft?'<span class="badge">Draft</span>':'';
function layout(){let r=0;const pos={};const walk=(id,d)=>{const k=vis(id,d);if(!k.length){pos[id]={d,y:r++*PITCH};return}k.forEach(c=>walk(c,d+1));pos[id]={d,y:(pos[k[0]].y+pos[k[k.length-1]].y)/2}};walk(root,0);return pos}
function canvas(){
 const pos=layout(),ids=Object.keys(pos),mx=Math.max(...ids.map(i=>pos[i].d)),my=Math.max(...ids.map(i=>pos[i].y));
 const W=PAD*2+mx*COLW+CW,H=PAD*2+my+LH+CH,X=i=>PAD+pos[i].d*COLW,Y=i=>PAD+pos[i].y;dim={W,H};
 const wires=ids.flatMap(i=>vis(i,pos[i].d).map(k=>{const x1=X(i)+CW,y1=Y(i)+LH+CH/2,x2=X(k),y2=Y(k)+LH+CH/2,m=(x1+x2)/2;return `<path d="M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}"/><circle cx="${x1}" cy="${y1}" r="3"/><circle cx="${x2}" cy="${y2}" r="3"/>`})).join('');
 const nodes=ids.map(i=>{const n=N[i],exp=pos[i].d>0&&n.kids.length;return `<div class="node dn ${n.type}" style="left:${X(i)}px;top:${Y(i)}px"><div class="tl">${ic(n.type,13)}${LBL[n.type]}</div><div class="card bare${cur===i?' on':''}" data-nid="${i}" tabindex="0" role="button"><div class="cb"><b title="${n.name}">${n.name}</b>${bdg(n)}</div>${exp?ibtn('chevR','raised nopen'+(opn.has(i)?' flip':''),`data-open="${i}"`,opn.has(i)?'Collapse':'Expand'):''}</div></div>`}).join('');
 return `<div class="wrap" style="width:${W*z}px;height:${H*z}px"><div class="world" style="width:${W}px;height:${H}px;transform:scale(${z})"><svg class="wires" width="${W}" height="${H}" fill="none">${wires}</svg>${nodes}</div></div>`}
function flat(id=root,d=0,a=[]){a.push([id,d]);N[id].kids.forEach(k=>flat(k,d+1,a));return a}
const tableHTML=()=>`<table class="tbl"><thead><tr><th>Name</th><th>Type</th><th>Owner</th><th>Status</th></tr></thead><tbody>${flat().map(([i,d])=>{const n=N[i];return `<tr data-nid="${i}" class="${cur===i?'on':''}"><td style="padding-left:${12+d*16}px"><span class="mr"><span class="c ${n.type}">${ic(n.type,13)}</span>${n.name}</span></td><td>${LBL[n.type]}</td><td>${av(n.w)}</td><td>${upd.has(i)?'<span class="badge tc">Updated</span>':`<button class="chip${n.draft?'':' req'}" aria-label="Change status" data-draft="${i}">${n.draft?'Draft':'Approved'}</button>`}</td></tr>`}).join('')}</tbody></table>`;
const readerHTML=()=>`<article class="reader">${flat().map(([i,d])=>{const n=N[i];return `<div class="rline" style="padding-left:${d*20}px" data-nid="${i}"><span class="tl ${n.type}">${ic(n.type,13)}${LBL[n.type]}</span><b>${n.name}</b>${bdg(n)}</div>`}).join('')}</article>`;
const crumbs=()=>{const p=[];for(let i=root;i;i=N[i].parent)p.unshift(i);return p.map((i,k)=>(k?`<span class="sepc">${ic('chevR',11)}</span>`:'')+btn(N[i].name,'ghost',N[i].type,`data-root="${i}"`)).join('')};
const stree=id=>{const n=N[id],k=n.kids,o=sopen.has(id);return `<button class="ti${cur===id?' on':''}" data-nid="${id}" ${k.length?`aria-expanded="${o}"`:''}>${k.length?cv():'<i class="sp"></i>'}<span class="c ${n.type}">${ic(n.type)}</span><span class="nm1">${n.name}</span></button>${k.length&&o?`<div class="br"><i></i><div>${k.map(stree).join('')}</div></div>`:''}`};
function side(){const el=$('#tree');
 if(sq){const m=Object.values(N).filter(n=>n.name.toLowerCase().includes(sq));el.innerHTML=m.length?m.map(n=>`<button class="ti${cur===n.id?' on':''}" data-nid="${n.id}"><i class="sp"></i><span class="c ${n.type}">${ic(n.type)}</span><span class="nm1">${n.name}</span></button>`).join(''):'<div class="hint" style="padding:8px">No matches</div>';return}
 el.innerHTML=stree('veh')}
function draw(){const el=$('#view'),st=el.scrollTop,sl=el.scrollLeft;
 $('#crumbs').innerHTML=crumbs();$('#zbar').hidden=mode!=='tree';
 if(mode==='tree'){el.className='canvas';el.innerHTML=canvas()}else{el.className='scroll';el.innerHTML=mode==='table'?tableHTML():readerHTML()}
 el.scrollTop=st;el.scrollLeft=sl}
function ctx(){const n=N[cur];$('#ctx').innerHTML=`<span class="hint">Context</span><span class="chip ${n.type}"><span class="c">${ic(n.type,13)}</span>${n.name}</span>`;$('#cmt').placeholder='Leave a comment on '+n.name+' or tag @flow'}
const refresh=()=>{side();draw();ctx()};
function pick(id){cur=id;const n=N[id];if(n.kids.length){root=id;sopen.add(id)}else if(n.parent){root=n.parent;sopen.add(n.parent)}}
function addNode(type){const id='n'+seq++,nm=LBL[type]+' '+(seq-1);T(id,type,nm,{d:1});N[id].parent=root;N[root].kids.push(id);sopen.add(root);cur=id;mode='tree';syncSeg();refresh();say('Created '+nm)}
function syncSeg(){document.querySelectorAll('[data-seg="view"] button').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()===mode))}
const AFF=[['shaft','Recalculate shaft power at the updated torque and max speed.'],['phase','Increase the peak current limit to reflect the higher torque demand on the inverter.'],['hold','Re-evaluate hold duration against the updated thermal model at 420 Nm.']];
$('#side').innerHTML=`<div class="side-top"><div class="shead">${sel('Electric vehicle project','Electric vehicle project,Battery pack,Charging network','logo','inline',178)}<span class="mr">${ibtn('search','','data-focus','Search tree')}${ibtn('panel','','data-panel="side"','Hide sidebar')}</span></div>
<label class="field" style="width:100%">${ic('search')}<input id="sq" placeholder="Search tree..." aria-label="Search tree"></label>
${sel('Base','Base,feature/torque-420,review/thermal','branch','',240).replace(/width:\d+px/,'width:100%')}
<button class="btn dashed" style="width:100%;justify-content:flex-start" data-toast="New branch created">${ic('plus')}<span style="flex:1;text-align:left">New Branch</span>${ic('lock')}</button>
<div class="mr" style="gap:var(--space-4)">${sel('Systems','Systems,Agents,Review','sys','',170)}<button class="btn primary" data-menu="Requirement,Functions,Test Case,System" data-act="new">${ic('plus')}New<span class="sep"></span>${ic('chev',12)}</button></div>
<div id="tree" role="tree" aria-label="Systems tree"></div></div>
<div class="shead" style="padding:0"><span class="mr" style="font-weight:500">${av('N',1)}Nils Eller</span><span class="mr">${ibtn('sun','','id="theme"','Toggle theme')}${ibtn('bell','','data-toast="No new notifications"','Notifications')}</span></div>`;
$('#main').innerHTML=`<div class="bar"><div class="mr">${ibtn('panel','','data-panel="side"','Toggle sidebar')}<div class="mr" style="gap:2px" id="crumbs"></div></div>${ibtn('panel','','data-panel="apanel"','Toggle agent panel')}</div><div class="hr"></div>
<div class="bar">${btn('New requirement','primary','plus','data-newreq')}${seg(['Table','Tree','Reader'],'Tree','seg').replace('data-seg','data-seg="view"')}<span class="mr" style="gap:2px">${btn('Fields','ghost','fields','data-toast="Fields panel opened"')}${btn('Import / Export','ghost','import','data-toast="Import / export opened"')}${btn('Filter','ghost','filter','data-toast="Filter opened"')}</span></div><div class="hr"></div>
<div class="cvw"><div id="view" class="canvas"></div><div class="zbar" id="zbar"><span class="hint" id="zl">100%</span>${ibtn('plus','raised','data-zoom="1"','Zoom in')}${ibtn('minus','raised','data-zoom="-1"','Zoom out')}${ibtn('fit','raised','data-zoom="0"','Fit to screen')}</div></div>`;
$('#apanel').innerHTML=`<div class="bar" style="flex-wrap:nowrap">${seg(['Agent','Automations'],'Agent','pill').replace('data-seg','data-seg="agent"')}${ibtn('panel','','data-panel="apanel"','Hide agent panel')}</div><div class="hr"></div>
<div id="t-agent" class="tab"><div class="shead">${sel('Powertrain requirements','Powertrain requirements,Chassis review,Thermal limits','','inline',200)}${btn('New','secondary','plus','data-toast="New thread started"')}</div>
<div class="msgs" id="msgs"><div class="bubble me">The peak motor torque requirement changed to 420 Nm. Update the downstream requirements and regenerate the motor housing to fit the new thermal envelope.</div>
<div><button class="btn ghost" data-fold aria-expanded="false">Execution plan${cv()}</button><ul class="steps" id="steps" data-branch hidden>${['Update Peak Motor Torque to 420 Nm','Propagate to affected child requirements','Regenerate motor housing CAD'].map(s=>`<li>${ic('check',12)}${s}</li>`).join('')}</ul></div>
<h4>Change</h4><p>Update Peak Motor Torque from 380 Nm to 420 Nm, propagate to affected child requirements, and regenerate the motor housing CAD.</p>
<div class="fcard"><div class="fhead">${ic('doc')}<span>MTR-HSG-4200-R02.step</span>${ibtn('kebab','','data-menu="Download,Copy link,Open in CAD" data-verb="Selected"','File actions')}</div><div class="fprev"><svg viewBox="0 0 140 94" width="120" height="80" fill="none" stroke="var(--text-placeholder)" stroke-width="1.5"><circle cx="70" cy="47" r="34"/><circle cx="70" cy="47" r="22"/><circle cx="70" cy="47" r="8"/><path d="M36 47H22M104 47h14M70 13V3M70 81v10"/></svg></div></div>
<h4>Affected requirements</h4>${AFF.map(([i,d])=>`<div class="aff"><button class="chip req" data-go="${i}"><span class="c">${ic('req',13)}</span>${N[i].name}</button><p>${d}</p></div>`).join('')}
<div>${btn('Apply changes','primary','','data-apply')}</div></div>
<div class="cmp"><div class="mr" id="ctx" style="gap:var(--space-6)"></div><div class="composer"><textarea id="cmt" rows="2" aria-label="Comment"></textarea><div class="cbar">${ibtn('plus','','data-toast="Attach a file"','Attach')}${sel('Base','Base,feature/torque-420','branch','inline',110)}<span class="grow"></span><button class="send" data-send disabled aria-label="Send comment">${ic('up')}</button></div></div></div></div>
<div id="t-auto" class="tab" hidden style="padding:var(--space-12);overflow:auto"><div class="slist"><div class="slh"><span>Automations</span><span data-count>2 Enabled</span></div>${row('Re-run verification on change',1,1)}${row('Notify owners of draft requirements',1,1)}${row('Weekly traceability report',0,1)}</div></div>`;

/* handlers */
document.addEventListener('click',e=>{
 const t=e.target;let x;
 if(t.closest('#pop')){const b=t.closest('button'),el=popFor;if(!b||!el)return;const v=b.textContent;
  if(el.dataset.act==='new')addNode(NT[v]);else if('pick' in el.dataset){el.querySelector('.lbl').textContent=v;say('Switched to '+v)}else say((el.dataset.verb||'Selected')+': '+v);
  closePop(true);return}
 if(!pop.hidden&&!t.closest('[data-menu]'))closePop();
 if(x=t.closest('[data-menu]')){if(popFor===x&&!pop.hidden)closePop();else{closePop();openMenu(x)}return}
 if(t.closest('#theme')){const r=document.documentElement,d=r.dataset.mode?r.dataset.mode==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.mode=d?'light':'dark';return}
 if(x=t.closest('[data-panel]')){$('#'+x.dataset.panel).classList.toggle('off');return}
 if(x=t.closest('[data-focus]')){$('#sq').focus();return}
 if(x=t.closest('[data-switch]')){const on=x.getAttribute('aria-checked')!=='true';x.setAttribute('aria-checked',on);const r=x.closest('.lrow');r.classList.toggle('off',!on);r.querySelector('.st-t').textContent=on?'Enabled':'Disabled';const L=r.closest('.slist');L.querySelector('[data-count]').textContent=L.querySelectorAll('[aria-checked=true]').length+' Enabled';say(r.querySelector('.nm').textContent+(on?' enabled':' disabled'));return}
 if(x=t.closest('[data-seg]>button')){const k=x.parentElement.dataset.seg;x.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===x));
  if(k==='view'){mode=x.textContent.toLowerCase();draw()}else{const a=x.textContent==='Agent';$('#t-agent').hidden=!a;$('#t-auto').hidden=a}return}
 if(x=t.closest('[data-zoom]')){const d=+x.dataset.zoom;z=d===0?Math.max(.5,Math.min(1,+(($('#view').clientWidth-8)/dim.W).toFixed(2))):Math.max(.5,Math.min(1.5,+(z+d*.1).toFixed(2)));$('#zl').textContent=Math.round(z*100)+'%';draw();return}
 if(x=t.closest('[data-open]')){const i=x.dataset.open;opn.has(i)?opn.delete(i):opn.add(i);draw();return}
 if(x=t.closest('[data-draft]')){const n=N[x.dataset.draft];n.draft=!n.draft;draw();say(n.name+(n.draft?' set to Draft':' approved'));return}
 if(x=t.closest('[data-root]')){pick(x.dataset.root);refresh();return}
 if(x=t.closest('[data-go]')){const i=x.dataset.go;cur=i;root=N[i].parent||i;sopen.add(root);mode='tree';syncSeg();refresh();say('Selected '+N[i].name);return}
 if(t.closest('[data-newreq]')){addNode('req');return}
 if(x=t.closest('[data-apply]')){if(!applied){applied=true;AFF.forEach(a=>upd.add(a[0]));$('#steps').classList.add('done');x.disabled=true;x.textContent='Applied';draw();say(AFF.length+' requirements updated')}return}
 if(x=t.closest('[data-send]')){const a=$('#cmt'),v=a.value.trim();if(v){const m=$('#msgs');m.insertAdjacentHTML('beforeend',`<div class="bubble me">${esc(v)}</div><div class="bubble bot">Demo reply: this preview is not connected to a model, so nothing was changed.</div>`);a.value='';x.disabled=true;m.scrollTop=m.scrollHeight}return}
 if(x=t.closest('[data-fold]')){const b=x.nextElementSibling;if(b&&b.hasAttribute('data-branch')){b.hidden=!b.hidden;x.setAttribute('aria-expanded',!b.hidden)}return}
 if(x=t.closest('[data-nid]')){const id=x.dataset.nid;
  if(x.classList.contains('ti')){if(t.closest('.cv')&&N[id].kids.length){sopen.has(id)?sopen.delete(id):sopen.add(id);side();return}pick(id)}else cur=id;
  refresh();return}
 if(x=t.closest('[data-toast]'))say(x.dataset.toast);
});
document.addEventListener('input',e=>{
 if(e.target.id==='sq'){sq=e.target.value.trim().toLowerCase();side()}
 if(e.target.id==='cmt')$('[data-send]').disabled=!e.target.value.trim();
});
document.addEventListener('keydown',e=>{
 if(!pop.hidden){const bs=[...pop.querySelectorAll('button')],i=bs.indexOf(document.activeElement);
  if(e.key==='Escape'){e.preventDefault();closePop(true)}else if(e.key==='ArrowDown'){e.preventDefault();bs[(i+1)%bs.length].focus()}else if(e.key==='ArrowUp'){e.preventDefault();bs[(i-1+bs.length)%bs.length].focus()}else if(e.key==='Tab')closePop();return}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card[data-nid]')){e.preventDefault();e.target.click()}
});
addEventListener('resize',()=>closePop());
if(innerWidth<=900){$('#side').classList.add('off');$('#apanel').classList.add('off')}
refresh();

</script>
</body>
</html>
