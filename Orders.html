<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sesama · Orders</title><link rel="stylesheet" href="sesama-ui.css"><link rel="stylesheet" href="forms.css"><link rel="stylesheet" href="dashboard-components.css"><link rel="stylesheet" href="library.css"><script src="rune-icons.js"></script><script src="library.js"></script><script src="workspace-blocks.js"></script><script src="charts.js"></script><script src="forms.js" defer></script><script src="dashboard-components.js" defer></script><script src="primitives.js" defer></script><style>.orders-filters{justify-content:space-between}.orders-search{flex:0 1 260px;min-width:180px}.orders-filter-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-left:auto;min-width:0}@media(max-width:700px){.orders-search{flex:1 1 100%}.orders-filter-actions{width:100%}}.order-detail-content{display:grid;gap:24px}.order-section-inset{padding-inline:var(--space-16,16px)}.order-detail-content>.sb-content-section{gap:16px}.order-info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0;padding:0}.order-info-grid>div{min-width:0}.order-info-grid dt{color:var(--text-subtle);margin-bottom:4px}.order-info-grid dd{margin:0;overflow-wrap:anywhere}.order-detail-content thead th{height:28px;padding-top:0;padding-bottom:8px}.order-detail-content tfoot td{text-align:right;font-weight:400;border:0;height:32px;padding-block:6px}.order-detail-content tfoot tr:first-child td{border-top:1px solid var(--color-hairline);padding-top:8px;height:32px}.order-detail-content tfoot td:first-child{color:var(--text-subtle)}.order-detail-content tfoot .order-total td{font-weight:500;color:var(--text-default);height:32px}.order-detail-content .sx-table{table-layout:fixed}.order-detail-content .sx-table td{overflow-wrap:anywhere}@media(max-width:520px){.order-info-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><div id="app"></div><script>
const U=SESAMA_UI,B=SESAMA_BLOCKS,escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('en',{style:'currency',currency:'USD'}).format(n);
const orders=Array.from({length:36},(_,i)=>({id:'ORD-'+(2101+i),customer:['Amelia Park','Noah Ibarra','Priya Desai','Marcus Chen','Emily Johnson','Alex Morgan'][i%6],date:'2026-10-'+String(30-i%30).padStart(2,'0'),channel:['Website','Marketplace','Direct'][i%3],items:1+i%4,total:79+i*13,payment:['Paid','Paid','Pending','Refunded'][i%4],fulfillment:['Completed','Shipped','Processing','Unfulfilled'][i%4]}));let query='',payment='All payments',fulfillment='All fulfillment',channel='All channels',period='All dates',page=1,size=15,filtered=[],sortKey='date',sortDirection='desc';
const nav=[{n:'Overview',i:'home',key:'overview'}],groups=[{title:'Sales',items:[{n:'Revenue reports',i:'grid-3x3',key:'revenue'},{n:'Orders',i:'file-text',key:'orders',selected:true},{n:'Customers',i:'users',key:'customers'}]},{title:'Team',items:[{n:'Members',i:'users',key:'members'},{n:'Workload',i:'list-filter',key:'workload'},{n:'Performance',i:'activity',key:'performance'}]}];
document.getElementById('app').innerHTML=B.appShell({sidebar:B.salesSidebar('orders'),header:B.pageHeader({title:'Orders',icon:'file-text'}),content:B.pageLayout('<div id="orders-toolbar"></div><div id="orders-results"></div>',{variant:'data'})});
function filters(){const menu=U.menuPopup([{label:'Export CSV',icon:'file-down',action:'orders:export'},{label:'Copy link',icon:'copy',action:'orders:copy'},{label:'Share',icon:'share-2',action:'orders:share'}],'Order actions');document.getElementById('orders-toolbar').innerHTML=B.contentSection({title:'All orders',description:'Track payments, fulfillment, and order details',content:`<div class="sb-section-filters orders-filters"><label class="field orders-search">${runeIcon('search',16)}<input id="order-search" value="${escape(query)}" placeholder="Search order or customer…" aria-label="Search orders"></label><div class="orders-filter-actions">${U.select('without label',{label:'Payment status',name:'order-payment',value:payment,options:['All payments','Paid','Pending','Refunded']})}${U.select('without label',{label:'Fulfillment',name:'order-fulfillment',value:fulfillment,options:['All fulfillment','Unfulfilled','Processing','Shipped','Completed']})}${U.select('without label',{label:'Channel',name:'order-channel',value:channel,icon:'list-filter',options:['All channels','Website','Marketplace','Direct']})}${U.select('without label',{label:'Order date',name:'order-period',value:period,icon:'calendar',options:['All dates','Last 7 days']})}${U.iconButton('kebab','outline size-base',`popovertarget="${menu.id}" aria-haspopup="menu"`,'Order actions')}${menu.html}</div></div>`})}
function status(text){const tone=text==='Paid'||text==='Completed'?'success':text==='Pending'?'warning':text==='Refunded'?'error':'informative';return U.statusDot(tone,text)}
function render(){filtered=orders.filter(r=>(r.id+' '+r.customer).toLowerCase().includes(query.toLowerCase())&&(payment==='All payments'||r.payment===payment)&&(fulfillment==='All fulfillment'||r.fulfillment===fulfillment)&&(channel==='All channels'||r.channel===channel)&&(period==='All dates'||r.date>='2026-10-24'));filtered.sort((a,b)=>{const x=a[sortKey],y=b[sortKey],result=typeof x==='number'?x-y:String(x).localeCompare(String(y),undefined,{numeric:true});return sortDirection==='asc'?result:-result});const pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages);const rows=filtered.slice((page-1)*size,page*size);const columns=[{key:'id',header:'Order ID'},{key:'customer',header:'Customer'},{key:'date',header:'Order date'},{key:'channel',header:'Channel'},{key:'items',header:'Items',align:'right'},{key:'total',header:'Total',align:'right',render:money},{key:'payment',header:'Payment',render:status},{key:'fulfillment',header:'Fulfillment',render:status},{key:'actions',header:'Actions',align:'right',render:(_,r)=>`<div class="sx-table-actions">${U.iconButton('file-text','',`data-order-details="${r.id}"`,'View details for '+r.id)}</div>`}];columns.forEach(column=>{column.sortable=column.key!=='actions'});const pagination=U.pagination(page,size,filtered.length);document.getElementById('orders-results').innerHTML='<div style="margin-top:12px">'+B.dataSection({title:'',description:'',table:U.table({label:'Orders',rows,columns,minWidth:1080,rowAction:'order-details',sortKey,sortDirection}),pagination})+'</div>'}
document.addEventListener('sesama:row-action',event=>{if(event.detail.action==='order-details')showOrder(orders.find(r=>r.id===event.detail.key),event.target)});
filters();render();document.addEventListener('input',e=>{if(e.target.id==='order-search'){query=e.target.value;page=1;render()}});document.addEventListener('change',e=>{if(e.target.closest('#orders-results')&&e.target.matches('[data-page-size]')){size=Number(e.target.value);page=1;render()}});
document.addEventListener('click',event=>{const sort=event.target.closest('#orders-results [data-table-sort]');if(sort){const key=sort.dataset.tableSort;sortDirection=sortKey===key&&sortDirection==='asc'?'desc':'asc';sortKey=key;page=1;render();document.querySelector('#orders-results [data-table-sort="'+key+'"]')?.focus({preventScroll:true});return}const option=event.target.closest('[data-select-value]');if(option){const input=option.closest('[data-select-demo]').querySelector('input[type=hidden]');if(input.name.startsWith('order-'))setTimeout(()=>{if(input.name==='order-payment')payment=input.value;if(input.name==='order-fulfillment')fulfillment=input.value;if(input.name==='order-channel')channel=input.value;if(input.name==='order-period')period=input.value;page=1;render()},0)}const pagination=event.target.closest('#orders-results [data-page-step],#orders-results [data-page-number]');if(pagination){page=pagination.hasAttribute('data-page-step')?page+Number(pagination.dataset.pageStep):Number(pagination.dataset.pageNumber);render()}const detail=event.target.closest('[data-order-details]');if(detail)showOrder(orders.find(r=>r.id===detail.dataset.orderDetails),detail);const key=event.target.closest('[data-tree-key]')?.dataset.treeKey;if(key==='overview')location.href='Dashboard%20overview.html';if(key==='revenue')location.href='Revenue%20report.html'});
function showOrder(order,trigger){const dialog=document.createElement('dialog');dialog.className='ds-modal';dialog.dataset.size='lg';dialog.setAttribute('aria-labelledby','order-detail-title');const subtotal=Math.round(order.total/1.1*100)/100,tax=order.total-subtotal;
const metadata=`<dl class="order-info-grid"><div><dt>Order date</dt><dd>${order.date} 13:20</dd></div><div><dt>Customer</dt><dd>${escape(order.customer)}</dd></div><div><dt>Channel</dt><dd>${escape(order.channel)}</dd></div><div><dt>Payment</dt><dd>${status(order.payment)}</dd></div><div><dt>Fulfillment</dt><dd>${status(order.fulfillment)}</dd></div></dl>`;
const items=U.table({label:'Order items and payment summary',columns:[{key:'name',header:'Product'},{key:'quantity',header:'Qty',align:'right',width:48},{key:'amount',header:'Amount',align:'right',width:120,render:money}],rows:[{id:1,name:'Essential cotton tee',quantity:order.items,amount:subtotal}]}).replace('</tbody></table>',`</tbody><tfoot><tr><td colspan="2">Subtotal</td><td>${money(subtotal)}</td></tr><tr><td colspan="2">Tax (10%)</td><td>${money(tax)}</td></tr><tr class="order-total"><td colspan="2">Total</td><td>${money(order.total)}</td></tr></tfoot></table>`);
const activity=B.activityFeed({items:[{title:'Order created',time:order.date,icon:'file-text'},{title:'Payment '+order.payment.toLowerCase(),time:'Payment status',icon:'circle-check'},{title:'Fulfillment: '+order.fulfillment,time:'Current status',icon:'archive'}]});
dialog.innerHTML=`<div class="sx-modal-header"><h2 id="order-detail-title">${order.id}</h2>${U.iconButton('x','sx-modal-close','data-modal-close','Close dialog')}</div><div class="sx-modal-body order-detail-content">${B.contentSection({title:'Order Details',content:`<div class="order-section-inset">${metadata}</div>`})}${B.contentSection({title:'Items',content:items})}${B.contentSection({title:'Order history',content:`<div class="order-section-inset">${activity}</div>`})}</div><div class="actions"><button type="button" class="btn secondary" data-modal-close>Close</button></div>`;document.body.append(dialog);dialog.addEventListener('close',()=>dialog.remove(),{once:true});dsOpenModal(dialog,trigger)}

const requestedOrder=new URLSearchParams(location.search).get('order');if(requestedOrder){const order=orders.find(r=>r.id===requestedOrder);if(order)window.addEventListener('DOMContentLoaded',()=>showOrder(order,document.querySelector('#orders-results [data-row-id="'+order.id+'"]')||document.querySelector('.sb-page-header')),{once:true})}
function exportOrders(){const keys=['id','customer','date','channel','items','total','payment','fulfillment'],csv=[keys.join(','),...filtered.map(r=>keys.map(k=>'"'+String(r[k]).replaceAll('"','""')+'"').join(','))].join('\r\n'),url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.addEventListener('click',async event=>{const item=event.target.closest('[data-menu-action^="orders:"]');if(!item)return;event.stopImmediatePropagation();item.closest('[popover]').hidePopover();if(item.dataset.menuAction==='orders:export'){exportOrders();return}try{if(item.dataset.menuAction==='orders:share'&&navigator.share)await navigator.share({title:'Orders',url:location.href});else{await navigator.clipboard.writeText(location.href);dsToast('Link copied.','success')}}catch(error){if(error.name!=='AbortError')dsToast('Sharing is unavailable.')}},true);
document.addEventListener('click',e=>{if(e.target.closest('[data-tree-key="customers"]'))location.href='Customers.html'});</script></body></html>
